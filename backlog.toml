body = '''
## Context

Authorization is Rego evaluated in process, not a sidecar. See
docs/adrs/004-embedded-opa-authorization.md and the Default policy section of
docs/domain-model.md.

## Deliverables

- `internal/policy/` wrapping the Rego Go package, loading a bundle at startup
- `policy/dagger.rego` implementing the default policy
- `policy/dagger_test.rego` run by `opa test` in `make test`
- Input shape: principal, action, resource, and proposed post-state

## Acceptance criteria

- [ ] A lease holder may mutate its own node and the children it creates, not
      arbitrary descendants
- [ ] A lease holder may add blocking edges into its own node
- [ ] Edges out of a node require link permission on the target
- [ ] Cross-project edges require write on the source and link on the target
- [ ] Only a `user` principal may complete a gate
- [ ] The principal that filed a gate may not drop, complete, reassign,
      reclassify, or unlink it
- [ ] Policy evaluation failure denies; it never falls open
- [ ] The bundle version is recorded on every event resulting from an
      authorized mutation

## Scenarios

```gherkin
Scenario: An agent cannot edit a sibling
  Given agent A holds a lease on node 7
  And node 8 shares node 7's parent
  When agent A patches node 8
  Then the patch is denied

Scenario: An agent can block itself
  Given agent A holds a lease on node 7
  When it creates a node and adds an edge from it into node 7
  Then the patch is allowed

Scenario: An agent cannot bypass its own gate
  Given agent A filed gate node 9 blocking node 7
  When agent A drops node 9
  Then the operation is denied
  And when agent A completes node 9
  Then the operation is denied

Scenario: A dropped gate is not approval
  Given a user drops gate node 9 with reason "no longer relevant"
  Then node 7 remains blocked

Scenario: Policy failure is closed
  Given a policy bundle that fails to compile
  When any authorization is evaluated
  Then it is denied
```
'''

[[nodes]]
