body = '''
## Context

See the Change stream section of docs/domain-model.md. Consumers are the
notifier, retrieval, and moderation. Orchestrators do not use this; they call
`ClaimNext`.

## Deliverables

- `EventService.WatchEvents` server stream with an opaque resumable cursor
- `LISTEN`/`NOTIFY` as a wake signal, with the events table as the transport
- Policy filtering per consumer principal

## Acceptance criteria

- [ ] The cursor is opaque and carries a commit-ordered position, not a bare
      event id; a transaction that takes a low id and commits late must not be skipped
- [ ] A consumer that disconnects resumes without loss or duplication beyond
      at-least-once
- [ ] A cursor older than the retained partition window is rejected so the
      consumer resynchronizes rather than silently skipping
- [ ] Startup establishes the listener, then reads durable state, then waits;
      a notification arriving during setup is not required for correctness
- [ ] A policy-filtered interval still advances the cursor

## Scenarios

```gherkin
Scenario: A late commit is not skipped
  Given transaction A allocates an event id and pauses
  And transaction B allocates a higher id and commits
  And a consumer reads through B's position
  When A commits
  Then the consumer receives A's event

Scenario: A consumer resumes after a restart
  Given a consumer that processed 100 events and stopped
  When it reconnects with its stored cursor
  Then it receives event 101 onward and no earlier event

Scenario: Missing a notification does not lose an event
  Given a consumer connecting exactly as a transaction commits
  Then a durable re-query after listening still returns the event
```

## Notes

This is the finding recorded in docs/domain-model.md about ULIDs not being
commit-ordered. Do not implement the naive last-id cursor.
'''

