body = '''
## Context

See State changes, Completion and results, and Drop semantics in
docs/domain-model.md. Results are what downstream agents read, so this is where
graph resume becomes possible.

## Deliverables

- Completion carrying a markdown result body under the size cap plus artifacts
- Drop carrying a reason and a cascade flag
- Reopen carrying a reason, non-retroactive
- A query returning the results and artifacts of a node's blocking predecessors

## Acceptance criteria

- [ ] Completing requires a live lease matching the fencing token
- [ ] Cascading drop drops the blocked subtree in the same transaction
- [ ] Non-cascading drop leaves dependents open and unblocked
- [ ] Reopen does not alter descendants
- [ ] Predecessor results are retrievable as the inputs to a node

## Scenarios

```gherkin
Scenario: Downstream context comes from the graph
  Given node 3 blocked by nodes 1 and 2, both done with results
  When I fetch the inputs for node 3
  Then both results and their artifacts are returned with their authors

Scenario: Axing functionality takes the subtree
  Given node 1 blocks nodes 2 and 3, and node 3 blocks node 4
  When node 1 is dropped with cascade
  Then nodes 1 through 4 are dropped in one transaction

Scenario: Reopening does not un-complete descendants
  Given node 1 is done and node 2, which it blocked, is also done
  When node 1 is reopened
  Then node 2 remains done
```
'''

