# Dagger's backlog, expressed in dagger's own domain model.
#
# Each node is a work order for an agent starting with an empty context window.
# It states what to build, what "done" means, and the scenarios the test suite
# must encode. Read the referenced docs before starting a node.
#
#   scripts/ready.py            what can be worked now
#   scripts/ready.py --all      what cannot, and why
#   scripts/ready.py --show 14  the full work order for one node
#
# Conventions for an agent working this backlog:
#   - `parent` is containment, `blocked_by` is dependency
#   - a node with open children is not ready; it is a grouping node
#   - never claim a node with assignee_kind = "user"; that is a human's
#   - specs are Ginkgo/Gomega; the Scenarios below are the required coverage
#   - every node ends green: `make lint && make test`

[project]
slug = "dagger"
title = "Dagger"
priority = "p1"

