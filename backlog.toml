title = "Migrations: organizations, projects, principals, identities"
body = '''
## Context

See the Project and Principal sections of docs/domain-model.md. Identity is
separate from principal so one person reaching dagger over a unix socket and
over the tailnet is one principal, and adding a transport inserts a row rather
than migrating.

## Deliverables

goose migrations under `internal/store/migrations/`:

- `organizations` — id, name, created_at
- `projects` — id, org_id, slug, title, priority, node_counter, archived_at,
  created_at; unique on (org_id, slug); unique on (org_id, id) so child tables
  can carry a composite foreign key
- `project_slug_aliases` — retired slugs that still resolve, unique per org
- `principals` — id, org_id, kind, created_at
- `principal_identities` — principal_id, scheme, value; unique on (scheme, value)

## Acceptance criteria

- [ ] Slugs are bounded at 100 characters and stored lowercase
- [ ] `node_counter` is a column, never a PostgreSQL sequence; per-project DDL
      would make projects expensive and projects must be free
- [ ] A retired slug resolves to the project that used to hold it
- [ ] Every migration has a tested `down`

## Scenarios

```gherkin
Scenario: One principal, several transport identities
  Given a principal with a unix identity and a tailscale identity
  When either identity is resolved
  Then the same principal id is returned

Scenario: Renaming a project keeps old references working
  Given a project with slug "oauth-spike" holding node 7
  When the project is renamed to "oauth-migration"
  Then "oauth-spike#7" still resolves to that node
  And "oauth-migration#7" resolves to the same node

Scenario: Slugs are unique within an organization only
  Given two organizations
  When each creates a project with slug "platform"
  Then both succeed
```
'''

[[nodes]]
number = 12
parent = 10
blocked_by = [11]
priority = "p0"
title = "Migrations: nodes, edges, leases"
body = '''
## Context

The core graph. Read the Node, Edge, Keys, and Lease sections of
docs/domain-model.md first. Tenancy columns and the readiness indexes are the
two things that are painful to change later.

## Deliverables

- `nodes` — id, number, org_id, project_id, parent_id, kind, title, body,
  status, priority, assignee_kind, assignee, labels, context_id, created_at;
  unique on (project_id, number); composite foreign key (org_id, project_id)
  referencing projects (org_id, id)
- `edges` — org_id, from_node, to_node, kind, created_at; primary key on
  (from_node, to_node, kind)
- `leases` — id, org_id, node_id, holder, on_behalf_of, harness, agent_ref,
  session_ref, claimed_at, expires_at, released_at, release_reason
- Indexes supporting: the readiness anti-join on edges by target, open children
  by parent_id, and the live-lease lookup by node

## Acceptance criteria

- [ ] Inserting a node whose org_id does not match its project's org_id fails
      at the database, not in application code
- [ ] Many leases per node over time; at most one without `released_at` and
      with `expires_at` in the future
- [ ] `EXPLAIN` on the readiness query shows index usage, not a sequential scan,
      with 10000 nodes in a project
- [ ] Every migration has a tested `down`

## Scenarios

```gherkin
Scenario: Tenancy mismatch is impossible
  Given a project belonging to organization A
  When a node is inserted claiming organization B and that project
  Then the database rejects the insert

Scenario: Lease history is retained
  Given a node that has been claimed and released three times
  When I read its leases
  Then three rows exist
  And at most one is live
```

## Notes

Do not add `blocked` or `ready` columns. Both are derived; see principle 1 in
docs/core-principles.md.
'''

[[nodes]]
number = 13
parent = 10
blocked_by = [12]
title = "Migrations: events, usage, comments, artifacts"
body = '''
## Context

See the Event, Usage, Comment, and Artifact sections of docs/domain-model.md.
Events are time-partitioned from the first migration because retrofitting
partitioning to a large table is painful.

## Deliverables

- `events` — id, org_id, project_id, node_id, principal_id, principal_kind,
  on_behalf_of, identity_scheme, request_id, op, reason, before, after,
  occurred_at; partitioned by occurred_at
- A partition management routine and at least the current and next partition
- `usage` — node_id, lease_id, principal, model, four token counts, kind, basis, created_at
- `comments` — id, node_id, author, body, in_reply_to, resolved_at, resolved_by, created_at
- `comment_revisions` — comment_id, body, author, created_at
- `artifacts` and `artifact_parts` — name, description, metadata; parts carry
  kind, inline text or blob digest or reference URI, media_type, size
- `blobs` — digest, media_type, size, backend, created_at
- `idempotency_keys` — org_id, request_id, request_hash, response, created_at

## Acceptance criteria

- [ ] Events are append-only: an update or delete trigger raises
- [ ] A partition exists for the current period and is created ahead of need
- [ ] Full-text index on node title, node body, comment body, and result body
- [ ] Digests are SHA-256, stored canonically
- [ ] Replaying a request id with a different request hash is distinguishable
      from replaying an identical one

## Scenarios

```gherkin
Scenario: The audit record cannot be rewritten
  Given an existing event row
  When any statement updates or deletes it
  Then the database raises an error

Scenario: An estimate and an actual coexist for one node
  Given a node estimated before work and reporting usage after
  When I read its usage rows
  Then both rows exist with different kinds
  And the most recent estimate is identifiable
```
'''

[[nodes]]
number = 14
parent = 10
blocked_by = [4, 13]
priority = "p0"
title = "sqlc wiring and generated queries"
body = '''
## Context

sqlc reads the goose migrations directly, so schema and queries have one source
of truth. See docs/adrs/007-core-tech-stack.md.

## Deliverables

- `sqlc.yaml` pointing at the migrations directory and `internal/store/queries/`
- `internal/store/` — generated code plus a hand-written `Store` type wrapping a
  pgx pool and exposing transactions
- `Makefile` target `generate` extended to run sqlc

## Acceptance criteria

- [ ] `make generate` is deterministic
- [ ] CI fails when generated query code is stale
- [ ] The store exposes a `WithTx` helper; every domain operation runs in one transaction
- [ ] Every query is organization-scoped in static SQL, with no
      caller-supplied predicate able to widen it

## Scenarios

```gherkin
Scenario: Organization scoping is not optional
  Given the generated query set
  When I inspect every query returning nodes, edges, events, or comments
  Then each contains an org_id predicate in its static SQL
```

## Notes

The org predicate being static and unconditional is the isolation boundary from
docs/adrs/006-provenance-not-authority.md. Policy narrows further; it never widens.
'''

# =================================================================== domain

[[nodes]]
number = 15
title = "Domain"
body = "Every rule that makes the graph a graph. Testable without a server, and where the invariants live."

[[nodes]]
number = 16
parent = 15
blocked_by = [14]
title = "Node numbering and reference resolution"
body = '''
## Context

See the Keys section of docs/domain-model.md. Numbers are per-project and start
at 1 so a short-lived project stays legible.

## Deliverables

- `internal/domain/refs.go` — parse and resolve `#7`, `slug#7`, `org/slug#7`, and patch aliases
- Block allocation of node numbers from `projects.node_counter` in one statement per patch

## Acceptance criteria

- [ ] A patch creating 40 nodes takes one counter update, not 40
- [ ] Concurrent patches in one project never assign the same number
- [ ] Resolution returns the node title so a caller can detect a wrong reference
- [ ] An unresolvable reference is a typed error naming what was not found
- [ ] Numbers are never reused, including after a drop

## Scenarios

```gherkin
Scenario: Numbers are unique under concurrency
  Given an empty project
  When 20 patches each creating 5 nodes are applied concurrently
  Then 100 nodes exist with numbers 1 through 100 and no duplicates

Scenario: A fabricated reference fails loudly across projects
  Given project "platform" has node 7 and project "spike" has none
  When I resolve "spike#7"
  Then resolution fails with a not-found error
```

## Notes

Numbers are dense within a project, so a mistyped number can resolve to a real
node. Returning the title on resolution is the mitigation; see the Keys section.
'''

[[nodes]]
number = 17
parent = 15
blocked_by = [14]
priority = "p0"
title = "Cycle detection over the combined wait relation"
body = '''
## Context

See the Acyclicity section of docs/domain-model.md. This is the invariant the
whole system rests on, and checking the edge table alone is not enough.

## Deliverables

- `internal/domain/cycles.go` — recursive CTE over the union of `blocks` edges
  and the implicit parent-waits-for-child relation
- Parent acyclicity enforced in its own right

## Acceptance criteria

- [ ] Detection runs over the resulting graph of a whole patch, not per operation
- [ ] The error names the cycle path in node references
- [ ] A parent chain that loops is rejected
- [ ] Detection is bounded by the connected component, not the project

## Scenarios

```gherkin
Scenario: A direct cycle is rejected
  Given node 1 blocks node 2
  When a patch adds an edge from node 2 to node 1
  Then the patch is rejected naming the cycle

Scenario: A cycle formed only within a patch is rejected
  Given an empty project
  When one patch creates nodes A, B and C and edges A to B, B to C, C to A
  Then the whole patch is rejected and no node is created

Scenario: A parent cannot become its own ancestor
  Given node 1 is the parent of node 2
  When a patch sets node 1's parent to node 2
  Then the patch is rejected

Scenario: Containment and dependency deadlock is rejected
  Given node 2 has parent node 1
  When a patch adds an edge from node 1 to node 2
  Then the patch is rejected
  Because node 1 waits for its open child and node 2 waits for node 1
```
'''

[[nodes]]
number = 18
parent = 15
blocked_by = [16, 17]
priority = "p0"
title = "Patch application with forward references and concurrency control"
body = '''
## Context

The central write path. Read the Patch section of docs/domain-model.md in full,
including Concurrency and Forward references. Every graph mutation goes through
here.

## Deliverables

- `internal/domain/patch.go` — apply a list of operations in one transaction
- Alias resolution: `create_node` takes an alias usable by any later operation
- Idempotency by `request_id`, with the stored response replayed on repeat
- Transaction-scoped advisory lock keyed on the organization, taken only by
  patches that mutate edges or parents

## Acceptance criteria

- [ ] A patch that creates and links nodes needs one call and one transaction
- [ ] A failing operation rolls back every operation in the patch
- [ ] The same request id with the same content returns the original response
      and emits no second set of events
- [ ] The same request id with different content is rejected as a conflict
- [ ] Patches touching only node fields take no advisory lock

## Scenarios

```gherkin
Scenario: Forward references resolve within one patch
  Given an empty project
  When a patch creates node A, creates node B blocked_by A, and adds an edge from B to A's parent
  Then all operations commit together
  And B is blocked by A

Scenario: Two concurrent patches cannot form a cycle between them
  Given nodes A and B with no edges
  When one patch adds an edge from A to B and another adds an edge from B to A concurrently
  Then exactly one commits
  And the other is rejected
  And the graph is acyclic

Scenario: A crash mid-patch leaves no half graph
  Given a patch creating five nodes where the fourth violates a constraint
  When the patch is applied
  Then no node from that patch exists

Scenario: A retried patch does not duplicate work
  Given a patch that committed but whose response was lost
  When the client retries with the same request id and body
  Then the original response is returned
  And no additional nodes or events exist
```

## Notes

The advisory lock is chosen over SERIALIZABLE with retries because it is
trivially correct and needs no retry path. If it contends, narrow it later; that
is measurable.
'''

[[nodes]]
number = 19
parent = 15
blocked_by = [18]
priority = "p0"
title = "Event emission on every mutation"
body = '''
## Context

See the Event section of docs/domain-model.md and
docs/adrs/006-provenance-not-authority.md. Provenance is transport-resolved and
never client-assertable; this node is where that becomes true in code.

## Deliverables

- `internal/domain/events.go` — one event per operation, written in the same
  transaction as the mutation it records
- Principal, principal kind, identity scheme, request id, op, reason, before and after
- Derivation of `human_touched` on a node from its events

## Acceptance criteria

- [ ] Every patch operation produces exactly one event
- [ ] Principal fields come from the request context, never from the request body
- [ ] Events carry the patch's request id so one atomic patch is reconstructable
- [ ] A transition without a reason where one is required is rejected

## Scenarios

```gherkin
Scenario: A patch is reconstructable from its events
  Given a patch of six operations
  When I read the events for that request id
  Then six events exist in operation order

Scenario: A client cannot forge an author
  Given a request whose body sets a principal field
  When the patch is applied
  Then the event records the transport-resolved principal
  And the body's value is ignored

Scenario: Dropping requires a reason
  When a patch drops a node with no reason
  Then the patch is rejected
```
'''

[[nodes]]
number = 20
parent = 15
blocked_by = [14]
priority = "p0"
title = "Readiness and Explain"
body = '''
## Context

See the Readiness section of docs/domain-model.md. Readiness is derived and
never stored. Explain is the same anti-join un-negated, and exists because of
node limbo.

## Deliverables

- `internal/domain/ready.go` — the ready query and the explain query
- Filters: project, kind, assignee kind, labels, minimum priority
- Ordering by priority then age, within one project only

## Acceptance criteria

- [ ] A node is ready when open, unblocked, unleased, and has no open children
- [ ] A `done` or `dropped` predecessor satisfies a blocking edge, except a gate
- [ ] Unset assignee_kind is agent-eligible, never excluded from the ready set
- [ ] An ordered query requires exactly one project
- [ ] Explain returns structured reasons: blocking nodes, live lease with expiry,
      waiting on a user
- [ ] A node with no possible path to readiness is identifiable

## Scenarios

```gherkin
Scenario: A grouping node is not work
  Given node 1 with two open children
  When I query the ready set
  Then node 1 is not ready
  And Explain says it has open children

Scenario: A grouping node becomes claimable when its children close
  Given node 1 whose children are all done
  Then node 1 is ready

Scenario: A dropped prerequisite unblocks its dependents
  Given node 2 is blocked by node 1
  When node 1 is dropped without cascade
  Then node 2 is ready

Scenario: A dropped gate does not unblock
  Given node 2 is blocked by gate node 1
  When node 1 is dropped
  Then node 2 is not ready
  And Explain still names node 1

Scenario: An unassigned node is agent work
  Given an open node with no assignee_kind
  When an agent queries the ready set with no filters
  Then the node is returned

Scenario: Explain answers why not
  Given a node blocked by two open nodes and one user-assigned node
  When I call Explain
  Then three structured reasons are returned
```
'''

