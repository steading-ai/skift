- Parts: inline text, managed blob, external reference
- Upload, finalize, and attach; orphan cleanup for unfinalized blobs

## Acceptance criteria

- [ ] Blobs are content-addressed by SHA-256 and immutable
- [ ] Upload and attach are atomic: a partial upload never attaches
- [ ] Identical bytes uploaded twice store once
- [ ] A `git` reference records the resolved commit, not just the branch
- [ ] Dagger never fetches a reference URI
- [ ] Reference URIs are stored verbatim and returned marked as untrusted input

## Scenarios

```gherkin
