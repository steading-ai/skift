body = '''
## Context

See the Artifact section of docs/domain-model.md and
docs/adrs/003-artifacts-are-content-addressed.md. Dagger is the manifest, not
the pipe.

## Deliverables

- `internal/domain/artifact.go` and `internal/store/blob/` with a `Backend` interface
