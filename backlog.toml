## Scenarios

```gherkin
Scenario: Opposite edges cannot both commit
  When two concurrent patches add an edge from A to B and from B to A
  Then exactly one commits and the graph is acyclic

Scenario: One winner among many claimants
  Given exactly one ready node
  When 100 clients call ClaimNext concurrently
  Then exactly one lease exists and 99 callers see no work

Scenario: A fenced write rejects a stale attempt
  Given attempt 1 expired and attempt 2 claimed the node
  When attempt 1 heartbeats, patches, or completes
  Then every such call is rejected and the node is unchanged

Scenario: Claiming races a new blocker
  Given a node about to be claimed
  When a patch adds a blocker concurrently
  Then either the claim wins and the patch is rejected, or the patch wins and
  the claim returns no work
  And no lease exists on a node that is not ready

Scenario: Idempotent retry after a lost response
  Given a patch and a claim whose responses were lost
  When each is retried with the same idempotency key
  Then the original results are returned and no duplicate rows or events exist

Scenario: Restart leaves no torn state
  When the service is killed during claim, patch, complete, and reap
  Then each operation is observably either fully applied or not applied

Scenario: Tenancy holds under every read path
  Given two organizations with similar data
  Then node references, search, explain, events, and blob digests from one
  reveal neither content nor existence to the other
