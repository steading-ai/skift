## Context

Generated code is checked in so a consumer of this repository needs no proto
toolchain. See docs/adrs/007-core-tech-stack.md.

## Deliverables

- `buf.yaml`, `buf.gen.yaml`, `buf.lock`
- `gen/dagger/v1/...` — messages and Connect handlers and clients
- `Makefile` target `generate`, and a `make lint` check that generated code is current

## Acceptance criteria

- [ ] `make generate` is deterministic; running twice leaves the tree unchanged
- [ ] CI fails if generated code is stale relative to the proto
- [ ] The generated Connect client compiles against a unix socket transport

## Scenarios

```gherkin
Scenario: Generated code is current
  Given a modified proto file
  When I run "make lint"
  Then the build fails saying generated code is stale
```
'''

