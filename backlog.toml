blocked_by = [29]
priority = "p0"
title = "Authorize the resolved patch inside its transaction"
body = '''
## Context

Read the Authorization subsection of the Patch section in docs/domain-model.md
and the request path in docs/architecture.md. This is a security invariant, not
a layering preference.

An interceptor cannot authorize a patch. Aliases are unresolved and cascades
unexpanded until the domain applies it, so the effective write set is unknown
until then. A patch could otherwise reach a node the caller may not touch.

## Deliverables

- Authorization of every effective operation after alias resolution and cascade
  expansion, against the same transaction snapshot being written
- Interceptor reduced to authentication and coarse method-level checks

## Acceptance criteria

- [ ] Every resolved operation is authorized, including operations produced by
      a cascade rather than written by the client
- [ ] One denial rolls back the entire patch
- [ ] Denials are audited with the policy bundle version
- [ ] The interceptor no longer attempts resource-level authorization

## Scenarios

```gherkin
Scenario: A cascade cannot reach unauthorized work
  Given node 1 blocks node 2, and the caller may not write node 2
  When the caller drops node 1 with cascade
  Then the whole patch is denied
  And node 1 is not dropped

Scenario: An alias cannot smuggle a write
  Given a patch whose later operation targets a node the caller may not touch
  When the patch is applied
  Then nothing in the patch commits

Scenario: Authorization sees the proposed state
  Given a patch that would move a node into a project the caller cannot write
  Then the patch is denied
```
'''

