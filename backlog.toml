Scenario: Deduplication by content
  Given two nodes attaching identical bytes
  Then one blob row exists with a reference count of two

Scenario: An interrupted upload attaches nothing
  Given an upload that fails before finalize
  Then no artifact references it
  And the partial blob is reclaimable
```

## Notes

Treat an agent-supplied URI as untrusted. Dagger does not fetch, so the SSRF
surface belongs to consumers, but do not hand them a URI without saying so.
