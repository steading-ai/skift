title = "Proto: domain messages"
body = '''
## Context

The proto package is the domain model, not a serialization detail. See
docs/adrs/002-connect-rpc-is-the-only-door.md and docs/domain-model.md, which is
the authority for every field below.

## Deliverables

`proto/dagger/v1/dagger.proto` containing at least:

- `Project` — id, org_id, slug, title, priority, node_counter is server-only,
  archived_at, created_at
- `Node` — id, number, org_id, project_id, parent_id, kind, title, body, status,
  priority, assignee_kind, assignee, labels, context_id, created_at;
  plus derived read-only fields: blocked, ready, claimed, human_touched
- `Edge` — from, to, kind
- `Lease` — id, node_id, holder, on_behalf_of, harness, agent_ref, session_ref,
  expires_at, release_reason
- `Principal` — id, org_id, kind
- `Result` — body, artifacts
- `Artifact` — name, description, parts, metadata
- `Part` — oneof: text, blob, reference; each carrying digest, media_type, size
- `Comment` — id, node_id, author, body, in_reply_to, resolved_at, resolved_by, revisions
- `Usage` — node_id, lease_id, principal, model, token counts, kind, basis, created_at
- `Event` — id, org_id, project_id, node_id, principal, principal_kind,
  on_behalf_of, identity_scheme, request_id, op, reason, before, after, occurred_at
- Enums: `Status`, `Priority`, `AssigneeKind`, `PrincipalKind`, `EdgeKind`,
  `ReleaseReason`, `DropReason`

## Acceptance criteria

- [ ] `buf lint` passes with the default plus comments rules
- [ ] Every message and field carries a comment stating its meaning
- [ ] Enums have an `_UNSPECIFIED = 0` member
- [ ] Server-assigned fields are commented as output-only
- [ ] No field allows a client to assert provenance: principal fields are output-only

## Scenarios

```gherkin
Scenario: Provenance cannot be asserted by a client
  Given the generated request messages
  When I inspect every field a client may set
  Then no field sets principal, principal_kind, on_behalf_of, or identity_scheme
```

## Notes

`on_behalf_of` is defined but not honored in this release; see the Delegation
section of docs/domain-model.md. Define it so shapes do not change later.
'''

[[nodes]]
number = 8
parent = 6
blocked_by = [7]
priority = "p0"
title = "Proto: service definitions"
body = '''
## Context

Three services over one contract. See docs/domain-model.md for semantics and
docs/architecture.md for where each is served.

## Deliverables

Add to `proto/dagger/v1/`:

`GraphService`
- `ApplyPatch(ApplyPatchRequest) returns (ApplyPatchResponse)`
- `GetNode`, `ListNodes`, `Explain`, `Search`
- `CreateProject`, `GetProject`, `ListProjects`, `ArchiveProject`

`WorkService`
- `Ready(ReadyRequest) returns (ReadyResponse)`
- `ClaimNext(ClaimNextRequest) returns (ClaimNextResponse)` — waits up to a deadline
- `Heartbeat`, `Release`

`EventService`
- `WatchEvents(WatchEventsRequest) returns (stream Event)`

`ApplyPatchRequest` carries `request_id`, `project`, `lease_id` when the caller
holds one, and a repeated `PatchOp`. `PatchOp` is a oneof over `create_node`,
`update_node`, `drop_node`, `complete_node`, `reopen_node`, `add_edge`,
`remove_edge`, `attach_artifact`, `add_comment`, `edit_comment`, `resolve_comment`.
`create_node` carries `alias`, `parent`, and `blocked_by`.

## Acceptance criteria

- [ ] `buf lint` and `buf breaking` against an empty baseline both pass
- [ ] A node reference is a single string type accepting `#7`, `slug#7`, `org/slug#7`, or an alias
- [ ] `ClaimNextRequest` carries filters: project, kind, assignee_kind, labels, min priority, wait duration
- [ ] `ClaimNextResponse` returns the node and its lease, including the lease id
- [ ] `ExplainResponse` returns structured reasons, not prose
- [ ] Every mutating RPC carries an idempotency key

## Scenarios

```gherkin
Scenario: A decomposition is expressible in one call
  Given a patch that creates two nodes and links them
  When I inspect the request message
  Then the second node references the first by alias
  And no node id from the server is required

Scenario: Claiming returns a fencing token
  When ClaimNext returns work
  Then the response includes a lease id
  And that lease id is required by ApplyPatch for that node
```

## Notes

Deliberately one call for all graph mutation. Claim, heartbeat, and release are
lease operations rather than graph operations, so they are separate.
'''

