title = "Leases with fencing, ClaimNext, heartbeat, release"
body = '''
## Context

Read the Lease section of docs/domain-model.md in full, including Fencing. The
fencing token prevents a silent wrong result and must exist from the first
implementation, not be added later.

## Deliverables

- `internal/domain/lease.go`
- Claim via `SELECT ... FOR UPDATE SKIP LOCKED` over the ready set
- Lease id returned by claim and required on every subsequent write to that node
- Server-bounded TTL, renewal on any write by the holder, explicit heartbeat
- Release with a reason; expiry as an event
- `ClaimNext` waits up to a caller-supplied deadline

## Acceptance criteria

- [ ] A write carrying no lease id, a stale lease id, or an expired lease is rejected
- [ ] A requested TTL above the server ceiling is clamped, not rejected
- [ ] Expiry returns the node to the ready set and writes an event
- [ ] A waiting `ClaimNext` holds no open transaction, row lock, or dedicated connection
- [ ] Concurrent claims never produce two live leases on one node

## Scenarios

```gherkin
Scenario: A stale worker cannot complete reclaimed work
  Given agent A holds a lease on node 7
  And that lease expires and agent B claims node 7
  When agent A completes node 7 with its old lease id
  Then the write is rejected
  And node 7 remains open and held by agent B

Scenario: Exactly one claimant wins
  Given one ready node
  When 100 concurrent ClaimNext calls run
  Then exactly one returns the node
  And exactly one live lease exists

Scenario: A lost claim response does not consume two nodes
  Given two ready nodes
  When a claim commits but its response is lost and the client retries with the same idempotency key
  Then the same node and lease are returned
  And the second node is still ready

Scenario: Work in progress keeps its lease
  Given a lease with a 60 second TTL
  When the holder applies a patch to its node at 50 seconds
  Then the lease expiry moves forward

Scenario: Waiting does not exhaust the connection pool
  Given a pool of 10 connections
  When 50 clients call ClaimNext with a 30 second wait and no work exists
  Then other queries continue to succeed
```
'''

