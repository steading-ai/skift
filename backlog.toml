title = "Go module, tool versions, and Makefile"
body = '''
## Context

Greenfield Go repository. See docs/adrs/007-core-tech-stack.md for the chosen
stack and why. This node establishes the build so every later node has a
`make test` to run.

## Deliverables

- `go.mod` — module `github.com/ivy/dagger`, Go 1.25
- `mise.toml` — pin go, buf, sqlc, goose, golangci-lint, hk
- `Makefile` — `build`, `test`, `test-unit`, `test-db`, `lint`, `generate`
- `.gitignore`, `.editorconfig`
- `cmd/dg/main.go` — cobra root command that prints version and exits 0
- `internal/version/version.go` — version injected via ldflags

## Acceptance criteria

- [ ] `mise install` bootstraps every tool with no system packages beyond podman
- [ ] `make build` produces `./dg`
- [ ] `./dg --version` prints a semver-shaped string
- [ ] `make test` passes with zero specs
- [ ] `make test-unit` and `make test-db` exist and differ by Ginkgo label filter

## Scenarios

```gherkin
Scenario: The binary reports its version
  Given a build produced by "make build"
  When I run "dg --version"
  Then the output contains a semantic version
  And the exit code is 0

Scenario: The binary is a single entry point
  When I run "dg --help"
  Then the output lists subcommands
  And no subcommand is implemented yet beyond version
```

## Notes

One binary, three faces: `dg` the CLI, `dg mcp` the stdio MCP server, `dg serve`
the service. See docs/architecture.md. Wire the cobra tree now so later nodes
attach commands rather than restructuring.
'''

[[nodes]]
number = 3
parent = 1
blocked_by = [2]
priority = "p0"
title = "PostgreSQL via podman compose"
body = '''
## Context

Dagger stores everything in PostgreSQL. See docs/adrs/001-relational-tables-over-graph-database.md.
Development runs against a real database, never a fake, because the interesting
behaviour is row locking and recursive queries.

## Deliverables

- `compose.yaml` — one PostgreSQL 18 service, named volume, exposed on 5432
- `.env.example` — connection string and credentials for local development
- `Makefile` targets `db-up`, `db-down`, `db-reset`
- `docs/how-to/develop.md` — how to bring the database up and run the suite

## Acceptance criteria

- [ ] `podman compose up -d` starts PostgreSQL and it accepts connections
- [ ] `make db-reset` drops and recreates the development database
- [ ] The compose file pins an image digest, not a floating tag
- [ ] No credential is committed; `.env` is gitignored and `.env.example` is not

## Scenarios

```gherkin
Scenario: The development database starts from nothing
  Given no running containers
  When I run "make db-up"
  Then PostgreSQL accepts a connection on the configured port within 30 seconds

Scenario: Reset returns the database to empty
  Given a database containing rows
  When I run "make db-reset"
  Then the database exists and contains no application tables
```

## Notes

Rootless podman. Tests use testcontainers rather than this compose stack; this
is for interactive development and for running the service locally.
'''

[[nodes]]
number = 4
parent = 1
blocked_by = [2]
title = "Lint, package boundaries, and pre-commit hooks"
body = '''
## Context

Two lint rules carry architectural decisions rather than style. See
docs/adrs/007-core-tech-stack.md and docs/architecture.md.

## Deliverables

- `.golangci.yml` with, at minimum, govet, staticcheck, errcheck, revive,
  depguard, forbidigo
- `hk.pkl` running lint and unit tests pre-commit
- `Makefile` target `lint`

## Acceptance criteria

- [ ] depguard denies any import of `internal/store` from outside `internal/domain`
- [ ] forbidigo denies importing `testing` outside files matching `*_suite_test.go`
- [ ] `make lint` passes on the current tree
- [ ] A deliberate violation of each rule fails the build

## Scenarios

```gherkin
Scenario: Handlers may not reach the store directly
  Given a file under "internal/server" importing "internal/store"
  When I run "make lint"
  Then the build fails naming the depguard rule

Scenario: Specs stay in Ginkgo
  Given a test file that is not a suite bootstrap importing "testing"
  When I run "make lint"
  Then the build fails naming the forbidigo rule
```

## Notes

The depguard rule is what keeps a second storage backend possible. Handlers hold
no graph logic and reach the database through the domain layer or not at all.
'''

[[nodes]]
number = 5
parent = 1
blocked_by = [3]
priority = "p0"
title = "Ginkgo suites and a testcontainers PostgreSQL harness"
body = '''
## Context

Every meaningful test in this project touches PostgreSQL: readiness anti-joins,
cycle detection, and claims under concurrency cannot be tested against a fake.
This node builds the harness the rest of the backlog depends on.

## Deliverables

- `internal/testsupport/postgres.go` — starts one PostgreSQL container per test
  run, applies migrations, and hands each spec an isolated database
- Suite bootstrap files for the packages that exist so far
- Ginkgo label `db` on specs requiring the container

## Acceptance criteria

- [ ] The container starts once per `go test` invocation, not once per spec
- [ ] Each spec receives a database with no rows left by another spec
- [ ] `make test-unit` runs with the label filter excluding `db` and needs no container
- [ ] `make test-db` runs only the labelled specs
- [ ] Specs run in parallel without interfering

## Scenarios

```gherkin
Scenario: Specs are isolated from one another
  Given two specs that both insert a project with the same slug
  When the suite runs them in parallel
  Then both succeed

Scenario: Unit tests need no container
  Given podman is not running
  When I run "make test-unit"
  Then the suite passes
```

## Notes

Isolation by database-per-spec or schema-per-spec, whichever is faster in
practice. Migrations run once against a template and are cloned per spec if that
proves quicker than re-running them.
'''

