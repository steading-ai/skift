# The rpm, the one definition of it. The Makefile runs nfpm over this
# once per GOARCH with VERSION set: `make package` on the binaries it
# compiles, and `make release` on the binaries in the release's archives.
# Each run sets SOURCE_DATE_EPOCH to the commit's time, which nfpm gives
# every file and the header's build time, so one commit and one binary
# make the same rpm.
#
# The package installs and does not start: the units are enabled by hand
# once /etc/skift/env names a database.
name: skift
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: default
priority: optional
maintainer: Ivy Evans <ivy@ivyevans.net>
description: |
  Agent-first project management on a DAG.
  skift is one binary with three faces: the service, an MCP server, and
  the CLI that talks to either.
vendor: Ivy Evans
homepage: https://github.com/steading-ai/skift
license: ISC
# The source files' modes are the checkout's, which depend on the umask
# of whoever cloned it; this one makes them the same everywhere.
umask: 0022
depends:
  - systemd
  # setpriv, with which the pre-install step runs the snapshot as skift.
  - util-linux
contents:
  - src: dist/skift-linux-${GOARCH}
    dst: /usr/bin/skift
    expand: true
    file_info:
      mode: 0755
  - src: contrib/systemd/skift.service
    dst: /usr/lib/systemd/system/skift.service
  - src: packaging/sysusers.d/skift.conf
    dst: /usr/lib/sysusers.d/skift.conf
  - src: packaging/tmpfiles.d/skift.conf
    dst: /usr/lib/tmpfiles.d/skift.conf
  # The directory of the settings file, /etc/skift/env, which the package
  # does not own: postinstall.sh writes it on a first install and rpm never
  # touches it after, so no upgrade changes it or leaves an env.rpmnew, and
  # removing the package leaves it in place. rpm -qf names no package for
  # it. Releases up to 0.4.0 owned it as config|noreplace; posttrans.sh puts
  # back what the upgrade from one of those saves as env.rpmsave.
  - dst: /etc/skift
    type: dir
    file_info:
      mode: 0755
  # The commented template the settings file points at. Not type: doc, so
  # an install that leaves documentation out still carries it.
  - src: packaging/env
    dst: /usr/share/doc/skift/env.example
    file_info:
      mode: 0644
scripts:
  # packaging/scripts/preinstall.sh with this package's version and schema
  # written in, by the Makefile.
  preinstall: dist/packaging/preinstall.sh
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
rpm:
  scripts:
    posttrans: packaging/scripts/posttrans.sh
  # Unset, the header would name the machine that built the rpm. A fixed
  # name keeps it the same wherever it is built.
  buildhost: reproducible
