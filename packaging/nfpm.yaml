# The rpm. `make package` builds skift for each architecture and runs nfpm
# once per GOARCH with VERSION set; see the Makefile for both values.
#
# The package installs and does not start: the units are enabled by hand
# once /etc/skift/env names a database.
name: skift
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: default
priority: optional
maintainer: Ivy Evans <ivy@ivyevans.net>
description: |
  Agent-first project management on a DAG.
  skift is one binary with three faces: the service, an MCP server, and
  the CLI that talks to either.
vendor: Ivy Evans
homepage: https://github.com/steading-ai/skift
license: ISC
depends:
  - systemd
contents:
  - src: dist/skift-linux-${GOARCH}
    dst: /usr/bin/skift
    expand: true
    file_info:
      mode: 0755
  - src: contrib/systemd/skift.service
    dst: /usr/lib/systemd/system/skift.service
  - src: contrib/systemd/skift-reap.service
    dst: /usr/lib/systemd/system/skift-reap.service
  - src: contrib/systemd/skift-reap.timer
    dst: /usr/lib/systemd/system/skift-reap.timer
  - src: packaging/sysusers.d/skift.conf
    dst: /usr/lib/sysusers.d/skift.conf
  - src: packaging/tmpfiles.d/skift.conf
    dst: /usr/lib/tmpfiles.d/skift.conf
  # The environment template, kept across upgrades once edited. Group
  # readable only: the database URL carries a password.
  - src: packaging/env
    dst: /etc/skift/env
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: skift
scripts:
  preinstall: packaging/scripts/preinstall.sh
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
