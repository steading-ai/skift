# Tool versions for skift.
#
# The harness that builds this project runs on Python. The project itself is Go.
# Every tool below installs through mise alone; the only system package the
# build assumes is podman, which testcontainers uses for the database specs
# and which runs compose.yaml through the docker-compose pinned here.
min_version = "2026.10.17"

[tools]
python = "3.14.9"
go = "1.26.10"
buf = "1.72.0"
sqlc = "1.31.1"
"aqua:pressly/goose" = "3.28.0"
golangci-lint = "2.13.2"
hk = "1.57.0"
opa = "1.19.1"
nfpm = "2.47.0"
docker-compose = "5.5.1"
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "0.6.0"

[env]
_.python.venv = { path = "harness/.venv", create = true }
