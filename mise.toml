# Tool versions for skift.
#
# Every tool below installs through mise alone; the only system package the
# build assumes is a container runtime for the database specs and for
# compose.yaml, which runs through the docker-compose pinned here. Locally that
# is podman; CI points DOCKER_HOST at the runner's Docker (see check.yml).
min_version = "2026.10.17"

[tools]
go = "1.26.10"
buf = "1.72.0"
sqlc = "1.31.1"
"aqua:pressly/goose" = "3.30.0"
golangci-lint = "2.15.0"
hk = "1.57.0"
opa = "1.19.1"
nfpm = "2.48.0"
crane = "0.22.1"
goreleaser = "2.20.2"
syft = "1.57.1"
docker-compose = "5.7.1"
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "0.6.0"
jactionlint = "2.5.0"
shellcheck = "0.11.0"
communique = "1.8.0"
