# Settings for `make mutate`, which runs gremlins over internal/domain.
# Keys sit under the command they configure; a flat "workers:" is ignored
# without a word, and the run silently takes the defaults.
#
# Every worker recompiles the domain's test binary and reruns it against
# the one shared PostgreSQL. The compiles are what fill the cores; the
# suites themselves mostly wait on the server, so twelve workers on eight
# cores keep it busy without starving each other. The timeout is a
# multiple of the solo baseline gremlins measured, with margin for that
# contention, since a mutant that times out is neither killed nor lived
# and just drops out of the score. Efficacy is killed over killed plus
# lived: the share of covered mutants the specs actually notice.
unleash:
  workers: 12
  timeout-coefficient: 6
  threshold:
    efficacy: 80
