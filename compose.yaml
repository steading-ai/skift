# Development PostgreSQL.
#
# Specs bring up their own database through testcontainers; this stack exists
# for running the service locally, inspecting the database by hand, and as
# the one server every `make mutate` worker shares. See docs/developing.md.
#
# Credentials and the host port come from .env, seeded from .env.example by
# `make db-up`. Every variable is required so a missing .env fails loudly
# instead of starting a database with an empty password.
name: skift

services:
  postgres:
    # Pinned to the multi-arch index digest. The database specs
    # pin the same one in internal/testsupport/postgres.go.
    image: docker.io/library/postgres:18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Durability is off: this data is disposable, and the specs that share
    # this server (make mutate) create and drop a database per spec. Every
    # DROP DATABASE forces an immediate checkpoint, and with fsync on the
    # single checkpointer spends most of its time in fsync while every
    # worker queues behind it.
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    # An init process as PID 1, not the postmaster. A process started with
    # `exec` (the health check's pg_isready, psql from make db-reset) that
    # outlives its session is reparented to PID 1; when the postmaster reaps
    # one that died of a signal, it takes it for a crashed backend and
    # restarts every server process, dropping live connections.
    init: true
    ports:
      - "127.0.0.1:${DB_PORT:?set DB_PORT in .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Over TCP on purpose: during first-run initialisation the server listens
      # only on its Unix socket, and a socket probe would report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  pgdata:
