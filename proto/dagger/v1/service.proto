// The dagger.v1 services: three faces over one contract. GraphService reads
// and mutates the graph, WorkService hands out and manages leases, and
// EventService serves the change stream. docs/domain-model.md is the
// rationale; docs/architecture.md says where each is served.
//
// Node references. Wherever a request names a node it does so with a single
// string in one of four forms: "#7" for a node in the request's project,
// "slug#7" for a node in another project of the same organization,
// "org/slug#7" fully qualified, or an alias declared by a create_node
// operation earlier in the same patch. The server never asks a client for a
// node id, and resolution returns the node's title so a caller can check
// that a dense number resolved to the node it meant.
//
// Idempotency. Every RPC that writes carries a client-supplied request_id.
// A repeated request_id returns the original result; the same id with
// different content is an error rather than a silent replay.
//
// Provenance is never client-assertable. Requests carry no principal; the
// server resolves the actor from the transport. See
// docs/adrs/006-provenance-not-authority.md.

syntax = "proto3";

package dagger.v1;

import "dagger/v1/dagger.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/ivy/dagger/gen/dagger/v1;daggerv1";

// GraphService reads and mutates the graph. ApplyPatch is the one door for
// every mutation of nodes, edges, artifacts, and comments; the remaining
// RPCs read, or manage the projects that scope the graph.
service GraphService {
  // ApplyPatch applies a flat list of operations in one transaction. Cycle
  // detection runs over the resulting graph, aliases resolve across the
  // whole patch, and one rejected operation rolls back every other.
  rpc ApplyPatch(ApplyPatchRequest) returns (ApplyPatchResponse);
  // GetNode returns one node with the relations and content attached to it.
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  // GetInputs returns the results of the predecessors that satisfy a node:
  // what a downstream agent assembles its context from. GetNode carries
  // only a hint of their size, so a caller pays for them when it wants
  // them.
  rpc GetInputs(GetInputsRequest) returns (GetInputsResponse);
  // ListNodes pages through the nodes of one project, filtered.
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  // Explain says why a node is not ready, as structured reasons. A node
  // with no reasons is ready.
  rpc Explain(ExplainRequest) returns (ExplainResponse);
  // Search runs a lexical query over titles, bodies, results, and comments
  // in the caller's organization, filtered by policy.
  rpc Search(SearchRequest) returns (SearchResponse);
  // CreateProject creates a project. No provisioning, no name adjudication:
  // the slug is derived from the title and disambiguated on collision.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  // GetProject returns one project by slug or id. Retired slugs resolve.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  // ListProjects pages through the caller's projects, most recently active
  // first. Archived projects are excluded unless asked for.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  // ArchiveProject makes a project read-only. Keys stay valid forever and
  // existing edges keep their meaning.
  rpc ArchiveProject(ArchiveProjectRequest) returns (ArchiveProjectResponse);
  // UpdateProject changes what a project carries about itself: today the
  // repository it delivers to. Fields left unset are left alone.
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  // HoldProject parks a project: every node in it leaves the ready set and
  // none of their statuses change. Unlike archiving, the project stays
  // writable, so parked work can still be planned.
  rpc HoldProject(HoldProjectRequest) returns (HoldProjectResponse);
  // UnholdProject releases a project's hold, returning its work to the
  // ready set unless something else holds it back.
  rpc UnholdProject(UnholdProjectRequest) returns (UnholdProjectResponse);
  // Focus parks everything outside a keep-set: the projects of an
  // organization, or the nodes of one project. It is declarative and
  // replacing, so calling it again in a scope retires the previous sweep
  // in the same transaction, and it holds only what is not already held.
  rpc Focus(FocusRequest) returns (FocusResponse);
  // ClearFocus releases the holds one focus sweep placed, leaving holds
  // placed on their own alone. It needs no sweep id: at most one sweep is
  // active per scope.
  rpc ClearFocus(ClearFocusRequest) returns (ClearFocusResponse);
}

// WorkService is the lease side of the contract: what is ready, claiming it
// under a fencing token, keeping the claim alive, and giving it back. These
// are lease operations rather than graph operations, so they are not patch
// operations.
service WorkService {
  // Ready returns the ready set of one project, ordered by priority then
  // age, without claiming anything.
  rpc Ready(ReadyRequest) returns (ReadyResponse);
  // ClaimNext performs Ready and Claim in one round trip. When nothing
  // matches it waits up to the request's wait duration for work to appear,
  // and returns the node already claimed under a lease.
  rpc ClaimNext(ClaimNextRequest) returns (ClaimNextResponse);
  // Heartbeat renews a live lease. Any write to the node by the holder
  // renews it implicitly; this is the explicit form.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Release ends a lease with a reason, returning the node to the ready set
  // if nothing else holds it back.
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
  // ReportUsage records what one attempt cost, attributed to the lease
  // that attempt runs under. It is the orchestrator's call: the process
  // that runs an agent is the one that can count its tokens, and an agent
  // principal is refused. An agent says what work is expected to cost
  // instead, with the estimate_node operation of a patch.
  rpc ReportUsage(ReportUsageRequest) returns (ReportUsageResponse);
}

// EventService serves the change stream every reactive consumer reads:
// notifiers, indexers, moderation, auditors. Orchestrators do not use it;
// they call ClaimNext with a wait.
service EventService {
  // WatchEvents streams events after a cursor, filtered by project and
  // operation, scoped to the caller's organization, and policy-filtered.
  // Delivery is at least once; consumers deduplicate by event id.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
}

// View is how much of each node a response carries. Every response that
// returns nodes is projected through one view on the way out, so the
// three shapes are the same on every RPC. Each RPC documents which view
// it takes when the request leaves it unspecified.
enum View {
  // VIEW_UNSPECIFIED takes the RPC's default.
  VIEW_UNSPECIFIED = 0;
  // VIEW_REFS is what a caller needs to name and act on a node and nothing
  // it already knows: number, reference, status, and the derived blocked,
  // ready, and claimed flags.
  VIEW_REFS = 1;
  // VIEW_SUMMARY is VIEW_REFS plus what choosing work needs: id,
  // project_id, title, kind, priority, assignee_kind, assignee, labels, and
  // human_touched. Never the body.
  VIEW_SUMMARY = 2;
  // VIEW_FULL is every field, the body included.
  VIEW_FULL = 3;
}

// ApplyPatchRequest is one atomic mutation of the graph.
message ApplyPatchRequest {
  // Client-supplied idempotency key. Required.
  string request_id = 1;
  // The project the patch applies to, by slug, org/slug, or id. Operations
  // do not repeat it; a node reference without a project half resolves
  // here.
  string project = 2;
  // The fencing token of the lease the caller holds. Required for any
  // operation that touches a leased node: the server checks in the same
  // statement that the lease is the node's current one and has not
  // expired. Empty when the caller holds no lease.
  string lease_id = 3;
  // The operations, applied in order within one transaction.
  repeated PatchOp ops = 4;
  // How much of each touched node to return. Defaults to VIEW_REFS: a
  // write never echoes the bodies it was sent.
  View view = 5;
}

// ApplyPatchResponse is the state of everything the patch touched, after
// it was applied, projected through the request's view. Under VIEW_REFS
// and VIEW_SUMMARY the nodes carry no body and events are left out; the
// event log is the audit record and WatchEvents reads it. VIEW_FULL
// returns every field and the events.
message ApplyPatchResponse {
  // Every node the patch created or changed, as it stands after the patch,
  // in the request's view.
  repeated Node nodes = 1;
  // Each alias declared by a create_node operation, mapped to the
  // slug#number reference of the node it created.
  map<string, string> aliases = 2;
  // The events the patch produced, in application order. Only under
  // VIEW_FULL.
  repeated Event events = 3;
  // How many events the patch produced, whatever the view.
  int32 event_count = 4;
  // The idempotency key the patch was applied under, so a caller that let
  // a client mint one can retry or find the patch's events.
  string request_id = 5;
  // The slug#number reference of every node the patch dropped, in the
  // order they were dropped, cascades included. Present under every view:
  // it is the list a reopen undoing the drop works from.
  repeated string dropped = 6;
}

// PatchOp is one operation in a patch. Exactly one of its forms is set.
message PatchOp {
  // The operation.
  oneof op {
    // Create a node, optionally aliased for later operations in the patch.
    CreateNodeOp create_node = 1;
    // Change the mutable fields of an existing node.
    UpdateNodeOp update_node = 2;
    // Abandon a node with a reason, optionally cascading to what it blocks.
    DropNodeOp drop_node = 3;
    // Finish a node with a result.
    CompleteNodeOp complete_node = 4;
    // Move a done node back to open.
    ReopenNodeOp reopen_node = 5;
    // Add a directed edge between two nodes.
    AddEdgeOp add_edge = 6;
    // Remove an edge. Removal is an event.
    RemoveEdgeOp remove_edge = 7;
    // Attach a named artifact to a node.
    AttachArtifactOp attach_artifact = 8;
    // Add a comment to a node.
    AddCommentOp add_comment = 9;
    // Replace the body of a comment, retaining the prior revision.
    EditCommentOp edit_comment = 10;
    // Mark a comment resolved.
    ResolveCommentOp resolve_comment = 11;
    // Record what a node is expected to cost, and why.
    EstimateNodeOp estimate_node = 12;
    // Park a node and everything it contains.
    HoldNodeOp hold_node = 13;
    // Release a node's hold.
    UnholdNodeOp unhold_node = 14;
  }
}

// CreateNodeOp creates a node. The server assigns its id and number; a
// patch refers to the new node by alias.
message CreateNodeOp {
  // Client-chosen name for the new node, usable as a node reference by any
  // later operation in the same patch. Scoped to the patch; never stored.
  string alias = 1;
  // Node reference of the parent, answering "what is this part of". Empty
  // for a root node. Containment, not dependency.
  string parent = 2;
  // Node references that must finish before this one is ready. Shorthand
  // for one add_edge of kind BLOCKS from each into the new node.
  repeated string blocked_by = 3;
  // Single-valued label such as task, bug, spike, or chore. Defaults to
  // task. Dagger never interprets it.
  string kind = 4;
  // Short human-readable summary.
  string title = 5;
  // Markdown. The prompt an agent receives.
  string body = 6;
  // Advisory priority. Defaults to P2.
  Priority priority = 7;
  // Which kind of principal may complete the node. Unset means
  // agent-eligible; USER makes the node a gate.
  AssigneeKind assignee_kind = 8;
  // Id of a specific principal to assign the node to, if any.
  string assignee = 9;
  // Free strings for projection and filtering.
  repeated string labels = 10;
}

// UpdateNodeOp changes the mutable fields of a node. A field left unset is
// left alone; status is not here because it changes only through the
// complete, drop, and reopen operations.
message UpdateNodeOp {
  // Node reference of the node to change.
  string node = 1;
  // New parent, as a node reference. Set to the empty string to make the
  // node a root. Reparenting stays within the node's project.
  optional string parent = 2;
  // New kind.
  optional string kind = 3;
  // New title.
  optional string title = 4;
  // New body.
  optional string body = 5;
  // New priority.
  optional Priority priority = 6;
  // New assignee kind.
  optional AssigneeKind assignee_kind = 7;
  // New assignee. Set to the empty string to unassign.
  optional string assignee = 8;
  // Replacement label set. Present with no values clears every label.
  Labels labels = 9;
}

// Labels is a label set, wrapped so that a request can distinguish
// "replace with nothing" from "leave alone".
message Labels {
  // The labels.
  repeated string values = 1;
}

// DropNodeOp abandons a node. Without cascade it asserts downstream work no
// longer needs this node; with cascade it asserts the functionality is gone
// and drops the subtree it blocks in the same patch, up to the bound the
// cascade states. A dropped gate never satisfies anything, and the
// response lists every node the drop took.
message DropNodeOp {
  // Node reference of the node to drop.
  string node = 1;
  // Classification of why.
  DropReason reason = 2;
  // Free text expanding on the reason. Recorded on the event.
  string detail = 3;
  // Present to also drop every node this one transitively blocks, within
  // the bound it states. Absent drops this node alone.
  Cascade cascade = 4;
}

// Cascade is the bound a cascading drop states before it runs. The server
// counts the subtree the drop would take and refuses the patch if the
// count exceeds max_nodes, naming both numbers, so a caller who has not
// looked at the graph cannot supply a truthful bound and one who has loses
// nothing.
message Cascade {
  // Most nodes the cascade may drop, counting the node the drop names
  // itself. A node blocking two others is a count of three. Nodes already
  // dropped are not counted, since the cascade does not change them. Must
  // be at least one.
  int32 max_nodes = 1;
}

// CompleteNodeOp finishes a node. Results of all blocking predecessors are
// the inputs a downstream agent assembles context from.
message CompleteNodeOp {
  // Node reference of the node to complete.
  string node = 1;
  // What the work produced.
  Result result = 2;
}

// ReopenNodeOp moves a done node back to open. It is how review feedback
// re-enters the graph, and it is not retroactive: descendants that consumed
// the earlier result are reopened explicitly in the same patch.
message ReopenNodeOp {
  // Node reference of the node to reopen.
  string node = 1;
  // Why. Recorded on the event.
  string reason = 2;
}

// AddEdgeOp adds a directed edge. Cycles over the union of BLOCKS edges and
// the parent relation are rejected for the patch as a whole.
message AddEdgeOp {
  // Node reference of the source. For BLOCKS, the node that must finish
  // first.
  string from = 1;
  // Node reference of the target. For BLOCKS, the node that waits.
  string to = 2;
  // The relation. Defaults to BLOCKS.
  EdgeKind kind = 3;
}

// RemoveEdgeOp removes an edge.
message RemoveEdgeOp {
  // Node reference of the source.
  string from = 1;
  // Node reference of the target.
  string to = 2;
  // The relation. Defaults to BLOCKS.
  EdgeKind kind = 3;
}

// AttachArtifactOp attaches a named artifact to a node.
message AttachArtifactOp {
  // Node reference of the node to attach to.
  string node = 1;
  // The artifact. Its name must be unique within the node.
  Artifact artifact = 2;
}

// AddCommentOp adds a comment to a node. The author is resolved from the
// transport.
message AddCommentOp {
  // Node reference of the node to comment on.
  string node = 1;
  // Markdown, under the configured size cap.
  string body = 2;
  // Id of the comment this one replies to, for threading. Empty for a
  // top-level comment.
  string in_reply_to = 3;
}

// EditCommentOp replaces the body of a comment. The prior body is retained
// as a revision.
message EditCommentOp {
  // Id of the comment to edit.
  string comment_id = 1;
  // The new body. Markdown, under the configured size cap.
  string body = 2;
}

// ResolveCommentOp marks a comment resolved. The resolver is recorded from
// the transport.
message ResolveCommentOp {
  // Id of the comment to resolve.
  string comment_id = 1;
}

// EstimateNodeOp records what a node is expected to cost, and why. An
// estimate needs no lease and changes neither the node nor its readiness:
// it precedes any attempt, so an agent planning work records one in the
// same patch that files it. Estimating again adds a record rather than
// replacing one, and the node's current estimate is the most recent.
// Reporting what an attempt actually cost is ReportUsage's, and the
// orchestrator's.
message EstimateNodeOp {
  // Node reference of the node being estimated.
  string node = 1;
  // Free string naming the model the estimate assumes. Optional.
  string model = 2;
  // Tokens the work is expected to send to the model.
  int64 input_tokens = 3;
  // Tokens the work is expected to produce.
  int64 output_tokens = 4;
  // Tokens expected to be served from the model's prompt cache.
  int64 cache_read_tokens = 5;
  // Tokens expected to be written to the model's prompt cache.
  int64 cache_write_tokens = 6;
  // What the estimate was reasoned from. Required: a number nobody can
  // revisit is not worth storing.
  string basis = 7;
}

// HoldNodeOp parks a node. Containment carries the hold, so everything
// under it is parked too, and nothing is written to those descendants.
// Only a user principal may hold.
message HoldNodeOp {
  // Node reference of the node to park.
  string node = 1;
  // Why the work is parked. Required: a hold nobody can explain is one
  // nobody dares release.
  string reason = 2;
}

// UnholdNodeOp releases the hold on a node. It does not touch a hold on
// something containing it, which keeps the node parked until that one is
// released too.
message UnholdNodeOp {
  // Node reference of the node to release.
  string node = 1;
  // Why the work is coming back. Required.
  string reason = 2;
}

// GetNodeRequest names one node.
message GetNodeRequest {
  // The project a bare "#7" reference resolves in, by slug, org/slug, or
  // id. Optional when the node reference carries its own project.
  string project = 1;
  // Node reference.
  string node = 2;
  // How much of the node to return. Defaults to VIEW_FULL: this is the
  // read whose purpose is the body. A narrower view also leaves out the
  // result, artifacts, and comments; edges and the lease stay.
  View view = 3;
}

// GetNodeResponse is a node with everything attached to it.
message GetNodeResponse {
  // The node, with its derived state.
  Node node = 1;
  // Every edge into or out of the node.
  repeated Edge edges = 2;
  // The result, once the node is done.
  Result result = 3;
  // The live lease, if any.
  Lease lease = 4;
  // Artifacts attached to the node, in attachment order.
  repeated Artifact artifacts = 5;
  // Comments on the node, oldest first.
  repeated Comment comments = 6;
  // How much the node's inputs come to. The bodies themselves are
  // GetInputs's to return.
  InputsHint inputs = 7;
  // The node's current estimate: the most recent estimate_node operation
  // recorded on it, if any. Only under VIEW_FULL.
  Usage estimate = 8;
  // What the node and everything under it cost and are expected to cost,
  // by model, computed on this read. Only under VIEW_FULL.
  Rollup usage = 9;
}

// GetInputsRequest names the node whose inputs to read.
message GetInputsRequest {
  // The project a bare "#7" reference resolves in, by slug, org/slug, or
  // id. Optional when the node reference carries its own project.
  string project = 1;
  // Node reference of the node whose inputs to read.
  string node = 2;
  // How much of each input to return. Defaults to VIEW_FULL: this is the
  // read whose purpose is the predecessors' results. A narrower view
  // leaves the result out and keeps each input's size, so a caller facing
  // more than it wants at once can fetch one predecessor at a time
  // through GetNode.
  View view = 3;
}

// GetInputsResponse is what a node depends on, ordered by project and then
// number. Inputs are not transitive: a predecessor's own inputs were its
// concern, and its result is the summary it owes whoever comes next.
message GetInputsResponse {
  // One entry per predecessor that satisfies the node.
  repeated Input inputs = 1;
}

// Input is one satisfied blocking predecessor as a downstream agent reads
// it. A predecessor still open does not satisfy anything and is not an
// input; a dropped one is, carrying no result, because a drop satisfies
// the dependency without producing anything.
message Input {
  // The predecessor, projected through the request's view.
  Node node = 1;
  // What it completed with, and the artifacts it attached. Carried under
  // VIEW_FULL alone.
  Result result = 2;
  // Size of the result body in bytes, whatever the view. Zero when the
  // predecessor has no result.
  int64 bytes = 3;
}

// InputsHint is how much a node's inputs come to without carrying them:
// two integers, enough to decide whether to spend a GetInputs call on
// them. Responses that hand a node to whoever will work it carry one.
message InputsHint {
  // How many of the node's satisfied predecessors have a result.
  int32 count = 1;
  // Total size of those result bodies in bytes.
  int64 bytes = 2;
}

// NodeFilter scopes and filters a claim or a read. Every field narrows;
// left unset, none of them do. status and held apply to reads only and are
// rejected on ClaimNextRequest and ReadyRequest, since neither notion
// makes sense mid-claim.
message NodeFilter {
  // Only these projects, by slug, org/slug, or id. Empty means every
  // project the caller may read: today, every project of the caller's
  // organization.
  repeated string projects = 1;
  // Only nodes of these kinds. Empty means every kind.
  repeated string kinds = 2;
  // Only nodes carrying every one of these labels.
  repeated string labels = 3;
  // Only nodes carrying at least one of these labels. Empty means labels
  // do not narrow.
  repeated string any_labels = 4;
  // Only nodes completable by this kind of principal. Unset means any.
  AssigneeKind assignee_kind = 5;
  // Only nodes at this priority or more urgent. Priority is comparable
  // only within a project, so this narrows each project's own nodes by
  // its own priority; it does not rank one project's nodes against
  // another's. Unset means any.
  Priority min_priority = 6;
  // Only children of this node, as a node reference. Empty means every
  // node.
  string parent = 7;
  // Reads only. Only nodes in this status. Unset means every status.
  Status status = 8;
  // Reads only. Only nodes that are effectively held: parked by a hold on
  // the node, on something containing it, or on its project. This is how
  // parked work is found again, since it is absent from the ready set.
  bool held = 9;
}

// ListNodesRequest pages through nodes matching a filter.
message ListNodesRequest {
  reserved 1, 2, 3, 4, 5, 6, 10;
  reserved "project", "status", "kind", "assignee_kind", "labels", "parent", "held";
  // What to match. No field is required; unset fields never narrow.
  NodeFilter filter = 11;
  // Maximum nodes to return. The server bounds it.
  int32 page_size = 7;
  // The next_page_token of the previous response. Empty for the first
  // page.
  string page_token = 8;
  // How much of each node to return. Defaults to VIEW_SUMMARY.
  View view = 9;
}

// ListNodesResponse is one page of nodes.
message ListNodesResponse {
  // The nodes.
  repeated Node nodes = 1;
  // Token for the next page. Empty when this is the last.
  string next_page_token = 2;
}

// ExplainRequest asks why one node is not ready.
message ExplainRequest {
  // The project a bare "#7" reference resolves in, by slug, org/slug, or
  // id. Optional when the node reference carries its own project.
  string project = 1;
  // Node reference.
  string node = 2;
}

// ExplainResponse is the structured answer. Each reason is one condition
// of readiness that does not hold; an empty list means the node is ready.
message ExplainResponse {
  // The node, so a caller can confirm the reference resolved to the node it
  // meant.
  Node node = 1;
  // Why the node is not ready. Empty when it is.
  repeated Reason reasons = 2;
}

// Reason is one condition keeping a node out of the ready set.
message Reason {
  // The condition.
  oneof reason {
    // The node is not open.
    NotOpenReason not_open = 1;
    // An unfinished predecessor blocks the node.
    BlockedReason blocked = 2;
    // A live lease holds the node.
    LeasedReason leased = 3;
    // An open child keeps the node from being ready.
    OpenChildReason open_child = 4;
    // The node's project is archived and read-only.
    ArchivedReason archived = 5;
    // The node, or a node containing it, carries a hold.
    HeldReason held = 6;
    // The node's project carries a hold.
    ProjectHeldReason project_held = 7;
  }
}

// NotOpenReason says the node is done or dropped.
message NotOpenReason {
  // The node's stored status.
  Status status = 1;
}

// BlockedReason names one predecessor that has not satisfied its BLOCKS
// edge: an open node, or a gate that has not been completed.
message BlockedReason {
  // The blocking node.
  Node blocker = 1;
  // Whether the blocker is a gate, which only completion by a user
  // principal satisfies. A dropped gate still blocks.
  bool gate = 2;
}

// LeasedReason names the live lease on the node.
message LeasedReason {
  // The lease, including its holder and expiry.
  Lease lease = 1;
}

// OpenChildReason names one open child.
message OpenChildReason {
  // The child.
  Node child = 1;
}

// ArchivedReason names the archived project the node belongs to.
message ArchivedReason {
  // The project.
  Project project = 1;
}

// HeldReason names one hold keeping the node parked. Explain reports
// every hold in the chain, because the node becomes ready only when all
// of them are released.
message HeldReason {
  // Number of the node carrying the hold, within the project.
  int64 number = 1;
  // Title of that node, so a caller need not look it up.
  string title = 2;
  // Whether the hold is on this node rather than on something containing
  // it.
  bool self = 3;
  // The hold itself: who parked the work, when, and why.
  Hold hold = 4;
}

// ProjectHeldReason names the held project the node belongs to.
message ProjectHeldReason {
  // The project, with its hold set.
  Project project = 1;
}

// SearchRequest is a lexical query over the caller's organization.
message SearchRequest {
  // The query, in PostgreSQL websearch syntax.
  string query = 1;
  // Restrict to one project, by slug, org/slug, or id. Empty searches every
  // project the caller may read.
  string project = 2;
  // Include nodes of archived projects. Off by default.
  bool include_archived = 3;
  // Maximum hits to return. The server bounds it.
  int32 page_size = 4;
  // The next_page_token of the previous response. Empty for the first
  // page.
  string page_token = 5;
  // How much of each hit's node to return. Defaults to VIEW_SUMMARY.
  View view = 6;
}

// SearchResponse is one page of hits, best match first.
message SearchResponse {
  // The hits.
  repeated SearchHit hits = 1;
  // Token for the next page. Empty when this is the last.
  string next_page_token = 2;
}

// SearchHit is one matching node.
message SearchHit {
  // The node that matched, in its title, body, result, or a comment.
  Node node = 1;
  // Output only. A fragment of the matching text with the match marked.
  string snippet = 2;
}

// CreateProjectRequest creates a project.
message CreateProjectRequest {
  // Client-supplied idempotency key. Required.
  string request_id = 1;
  // Human-readable name. The slug is derived from it.
  string title = 2;
  // Requested slug. Empty derives one from the title. Normalized to
  // lowercase and disambiguated on collision either way.
  string slug = 3;
  // Advisory priority of the project. Dagger never sorts by it.
  Priority priority = 4;
  // The clone URL of the repository the project delivers to. Optional; an
  // absolute URL when given.
  string vcs_url = 5;
}

// CreateProjectResponse is the created project.
message CreateProjectResponse {
  // The project, with its assigned id and slug.
  Project project = 1;
}

// GetProjectRequest names one project.
message GetProjectRequest {
  // The project, by slug, org/slug, or id. Retired slugs resolve.
  string project = 1;
}

// GetProjectResponse is one project.
message GetProjectResponse {
  // The project.
  Project project = 1;
}

// ListProjectsRequest pages through the caller's projects.
message ListProjectsRequest {
  // Include archived projects. Off by default.
  bool include_archived = 1;
  // Maximum projects to return. The server bounds it.
  int32 page_size = 2;
  // The next_page_token of the previous response. Empty for the first
  // page.
  string page_token = 3;
}

// ListProjectsResponse is one page of projects, most recently active
// first.
message ListProjectsResponse {
  // The projects.
  repeated Project projects = 1;
  // Token for the next page. Empty when this is the last.
  string next_page_token = 2;
}

// ArchiveProjectRequest makes a project read-only.
message ArchiveProjectRequest {
  // Client-supplied idempotency key. Required.
  string request_id = 1;
  // The project, by slug, org/slug, or id.
  string project = 2;
}

// ArchiveProjectResponse is the archived project.
message ArchiveProjectResponse {
  // The project, with archived_at set.
  Project project = 1;
}

// UpdateProjectRequest changes a project. A field that is unset is left
// alone; one that is present and empty is cleared.
message UpdateProjectRequest {
  // Client-supplied idempotency key. Required.
  string request_id = 1;
  // The project, by slug, org/slug, or id.
  string project = 2;
  // New clone URL of the repository the project delivers to: an absolute
  // URL, or the empty string to clear it.
  optional string vcs_url = 3;
}

// UpdateProjectResponse is the project as it now stands.
message UpdateProjectResponse {
  // The project.
  Project project = 1;
}

// HoldProjectRequest parks a project.
message HoldProjectRequest {
  // Client-supplied idempotency key. Required.
  string request_id = 1;
  // The project, by slug, org/slug, or id.
  string project = 2;
  // Why the work is parked. Required.
  string reason = 3;
}

// HoldProjectResponse is the held project.
message HoldProjectResponse {
  // The project, with its hold set.
  Project project = 1;
  // How many open nodes of the project left the ready set.
  int32 held_count = 2;
}

// UnholdProjectRequest releases a project's hold.
message UnholdProjectRequest {
  // Client-supplied idempotency key. Required.
  string request_id = 1;
  // The project, by slug, org/slug, or id.
  string project = 2;
  // Why the work is coming back. Required.
  string reason = 3;
}

// UnholdProjectResponse is the released project.
message UnholdProjectResponse {
  // The project, with no hold.
  Project project = 1;
}

// FocusRequest parks everything outside the keep-set of one scope. The
// scope is the organization when project is empty and the keep-set names
// projects; otherwise it is that project and the keep-set names its
// nodes.
message FocusRequest {
  // Client-supplied idempotency key. Required.
  string request_id = 1;
  // The project the sweep is scoped to, by slug, org/slug, or id. Empty
  // sweeps the organization's projects.
  string project = 2;
  // What stays live. Projects when project is empty, otherwise nodes of
  // that project. Everything else in scope is held.
  repeated string keep = 3;
  // Why everything else is parked. Required.
  string reason = 4;
}

// FocusResponse reports the sweep that is now active.
message FocusResponse {
  // The sweep's id, recorded on every hold it placed. A caller needs it
  // for nothing: ClearFocus finds the active sweep of a scope on its own.
  string group = 1;
  // How many projects or nodes this sweep parked.
  int32 held_count = 2;
  // How many holds the sweep it replaced released.
  int32 released_count = 3;
}

// ClearFocusRequest releases the active sweep of one scope.
message ClearFocusRequest {
  // Client-supplied idempotency key. Required.
  string request_id = 1;
  // The project whose sweep to clear, by slug, org/slug, or id. Empty
  // clears the organization's sweep over projects.
  string project = 2;
  // The sweep to clear. Empty clears the scope's active sweep, which is
  // the ordinary case; give it only to disambiguate.
  string group = 3;
  // Why the work is coming back. Required.
  string reason = 4;
}

// ClearFocusResponse reports what came back.
message ClearFocusResponse {
  // How many holds were released.
  int32 released_count = 1;
}

// ReadyRequest asks for the ready set matching a filter. Ordering is by
// priority then age within a project; across projects with matching ready
// work it is a turn, round-robin per principal and filter, since priority
// is not comparable across projects.
message ReadyRequest {
  reserved 1, 2, 3, 4, 5;
  reserved "project", "kind", "assignee_kind", "labels", "min_priority";
  // What to match. No field is required; unset fields never narrow. Empty
  // filter.projects means every project the caller may read. status and
  // held are rejected: reads-only fields of NodeFilter that do not apply
  // to the ready set.
  NodeFilter filter = 9;
  // Maximum nodes to return. The server bounds it.
  int32 page_size = 6;
  // The next_page_token of the previous response. Empty for the first
  // page.
  string page_token = 7;
  // How much of each node to return. Defaults to VIEW_SUMMARY.
  View view = 8;
}

// ReadyResponse is one page of the ready set.
message ReadyResponse {
  // Ready nodes, most urgent and then oldest first.
  repeated Node nodes = 1;
  // Token for the next page. Empty when this is the last.
  string next_page_token = 2;
  // How many open nodes matching the same filters are held rather than
  // ready. Counted only when the first page is empty, so that an empty
  // answer says whether the work is finished or parked. Zero otherwise.
  int32 held_count = 3;
}

// ClaimNextRequest asks for the next ready node matching a filter,
// claimed. Selecting across projects is turn-based, not the orchestrator's:
// an empty filter.projects draws round-robin from every project the caller
// may read, one call at a time.
message ClaimNextRequest {
  reserved 2, 3, 4, 5, 6;
  reserved "project", "kind", "assignee_kind", "labels", "min_priority";
  // Client-supplied idempotency key. Required.
  string request_id = 1;
  // What to match. No field is required; unset fields never narrow. Empty
  // filter.projects means every project the caller may read. status and
  // held are rejected: reads-only fields of NodeFilter that do not apply
  // to a claim.
  NodeFilter filter = 12;
  // How long to wait for matching work before returning empty. Zero
  // returns immediately. The server bounds it.
  google.protobuf.Duration wait = 7;
  // Requested lease TTL. The server bounds it and applies its default when
  // unset.
  google.protobuf.Duration ttl = 8;
  // Free string naming the executing harness, such as claude-code or hive.
  string harness = 9;
  // Where this attempt will run: an A2A agent card URL, or whatever the
  // harness identifies itself as. Recorded for placement affinity.
  string agent_ref = 10;
  // Optional harness session identifier, for a session that works several
  // nodes.
  string session_ref = 11;
}

// ClaimNextResponse is the claimed node and the lease fencing it. Both are
// unset when the wait elapsed with nothing to claim.
message ClaimNextResponse {
  // The claimed node.
  Node node = 1;
  // The lease. Its id is the fencing token every later write to the node
  // must carry.
  Lease lease = 2;
  // How much the claimed node's inputs come to. Unset when nothing was
  // claimed.
  InputsHint inputs = 3;
  // The project the node was claimed in, so an orchestrator reads where the
  // work delivers without a second call. Unset when nothing was claimed.
  Project project = 4;
}

// HeartbeatRequest renews a lease.
message HeartbeatRequest {
  // Client-supplied idempotency key. Required.
  string request_id = 1;
  // The fencing token of the lease to renew.
  string lease_id = 2;
  // Requested TTL from now. The server bounds it and applies its default
  // when unset.
  google.protobuf.Duration ttl = 3;
}

// HeartbeatResponse is the renewed lease.
message HeartbeatResponse {
  // The lease, with its new expiry.
  Lease lease = 1;
}

// ReleaseRequest ends a lease. Completing a node releases its lease as part
// of the patch; this is for every other way an attempt ends.
message ReleaseRequest {
  // Client-supplied idempotency key. Required.
  string request_id = 1;
  // The fencing token of the lease to release.
  string lease_id = 2;
  // Why the attempt ended.
  ReleaseReason reason = 3;
  // Free text expanding on the reason. Recorded on the event.
  string detail = 4;
}

// ReleaseResponse is the released lease.
message ReleaseResponse {
  // The lease, with its release reason set.
  Lease lease = 1;
}

// ReportUsageRequest records what one attempt on a node has cost so far.
// It is a write to the node's attempt, so it carries that attempt's lease
// and renews it, as any write by the holder does. Reporting again adds a
// record rather than replacing one: the attempt's cost is their sum.
message ReportUsageRequest {
  // Client-supplied idempotency key. Required.
  string request_id = 1;
  // The project a bare "#7" reference resolves in, by slug, org/slug, or
  // id. Optional when the node reference carries its own project.
  string project = 2;
  // The fencing token of the lease the cost is attributed to. Required,
  // and it must be the node's current lease and the caller's own: an
  // orchestrator reports for the attempts it dispatched under its own
  // claim. A retry is a second attempt with records of its own rather
  // than more tokens on the first.
  string lease_id = 3;
  // Node reference of the node the lease is held on.
  string node = 4;
  // Free string naming the model the tokens were spent on. Optional.
  string model = 5;
  // Tokens sent to the model.
  int64 input_tokens = 6;
  // Tokens produced by the model.
  int64 output_tokens = 7;
  // Tokens served from the model's prompt cache.
  int64 cache_read_tokens = 8;
  // Tokens written to the model's prompt cache.
  int64 cache_write_tokens = 9;
}

// ReportUsageResponse is the record that was stored.
message ReportUsageResponse {
  // The usage record, as it stands.
  Usage usage = 1;
}

// WatchEventsRequest opens the change stream from a position.
message WatchEventsRequest {
  // Opaque cursor from a previous response. Empty starts from now. A cursor
  // older than the replay window is rejected so the consumer resynchronizes
  // rather than silently skipping.
  string cursor = 1;
  // Only events in this project, by slug, org/slug, or id. Empty means every
  // project the caller may read.
  string project = 2;
  // Only events for these operations, such as create_node or add_edge.
  // Empty means every operation.
  repeated string ops = 3;
}

// WatchEventsResponse is one event and the cursor to resume after it. The
// cursor is a commit-ordered position, not the event id, so a stalled
// transaction that commits late is never skipped. A response without an
// event carries a position alone: the opening position of a stream started
// from now, the position after an interval the policy filtered entirely,
// or a refresh of a quiet stream, so a stored cursor keeps up.
message WatchEventsResponse {
  // The event. Absent when the response carries a position alone.
  Event event = 1;
  // Output only. Opaque position after this event, to pass as the next
  // request's cursor.
  string cursor = 2;
}
