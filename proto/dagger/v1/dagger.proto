// The dagger.v1 domain model. This file is the contract every client, store,
// and transport is derived from; docs/domain-model.md is its rationale.
//
// Provenance is never client-assertable. Every field that names the actor
// behind a write (principal, principal_kind, on_behalf_of, identity_scheme,
// holder, author) is output only: the server resolves it from the transport
// and ignores anything a request carries. See
// docs/adrs/006-provenance-not-authority.md.

syntax = "proto3";

package dagger.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/ivy/dagger/gen/dagger/v1;daggerv1";

// Status is the stored lifecycle state of a node. Nothing else is stored;
// blocked, ready, and claimed are derived.
enum Status {
  // STATUS_UNSPECIFIED is the zero value and carries no meaning.
  STATUS_UNSPECIFIED = 0;
  // STATUS_OPEN is work not yet finished. The state a node is created in.
  STATUS_OPEN = 1;
  // STATUS_DONE is work completed with a result.
  STATUS_DONE = 2;
  // STATUS_DROPPED is work abandoned with a reason.
  STATUS_DROPPED = 3;
}

// Priority is an advisory ordering hint comparable only within one project.
// Dagger uses it as the first sort key of the ready set and derives nothing
// else from it.
enum Priority {
  // PRIORITY_UNSPECIFIED is the zero value; the server treats it as P2.
  PRIORITY_UNSPECIFIED = 0;
  // PRIORITY_P0 is the most urgent.
  PRIORITY_P0 = 1;
  // PRIORITY_P1 is urgent.
  PRIORITY_P1 = 2;
  // PRIORITY_P2 is the default.
  PRIORITY_P2 = 3;
  // PRIORITY_P3 is low.
  PRIORITY_P3 = 4;
  // PRIORITY_P4 is the least urgent.
  PRIORITY_P4 = 5;
}

// AssigneeKind says which kind of principal may complete a node. Unset means
// agent-eligible; a user-assigned node is a gate.
enum AssigneeKind {
  // ASSIGNEE_KIND_UNSPECIFIED is the zero value: the node is agent-eligible.
  ASSIGNEE_KIND_UNSPECIFIED = 0;
  // ASSIGNEE_KIND_AGENT restricts completion to agent principals.
  ASSIGNEE_KIND_AGENT = 1;
  // ASSIGNEE_KIND_USER restricts completion to user principals, making the
  // node a gate that only a person can satisfy.
  ASSIGNEE_KIND_USER = 2;
}

// PrincipalKind classifies who acts: a person, an agent, or a service.
enum PrincipalKind {
  // PRINCIPAL_KIND_UNSPECIFIED is the zero value and carries no meaning.
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  // PRINCIPAL_KIND_USER is a human.
  PRINCIPAL_KIND_USER = 1;
  // PRINCIPAL_KIND_AGENT is a model-driven agent or the orchestrator running
  // one.
  PRINCIPAL_KIND_AGENT = 2;
  // PRINCIPAL_KIND_SERVICE is a non-interactive service such as a notifier or
  // an indexer.
  PRINCIPAL_KIND_SERVICE = 3;
}

// EdgeKind names the relation an edge expresses. Only BLOCKS affects
// readiness; other kinds may be added later as annotations.
enum EdgeKind {
  // EDGE_KIND_UNSPECIFIED is the zero value and carries no meaning.
  EDGE_KIND_UNSPECIFIED = 0;
  // EDGE_KIND_BLOCKS means the target is not ready while the source is open.
  EDGE_KIND_BLOCKS = 1;
}

// ReleaseReason records why a lease ended, so an orchestrator can tell a gate
// from a crash from a budget stop.
enum ReleaseReason {
  // RELEASE_REASON_UNSPECIFIED is the zero value: the lease is still live.
  RELEASE_REASON_UNSPECIFIED = 0;
  // RELEASE_REASON_COMPLETE means the holder completed the node.
  RELEASE_REASON_COMPLETE = 1;
  // RELEASE_REASON_GATE means the holder filed a gate and stepped back to
  // wait on it.
  RELEASE_REASON_GATE = 2;
  // RELEASE_REASON_CRASH means the holder's attempt failed.
  RELEASE_REASON_CRASH = 3;
  // RELEASE_REASON_BUDGET means the holder stopped at a spending limit.
  RELEASE_REASON_BUDGET = 4;
  // RELEASE_REASON_EXPIRED means the lease reached its TTL without renewal.
  RELEASE_REASON_EXPIRED = 5;
  // RELEASE_REASON_PREEMPTED means the lease was taken away by policy or by
  // an operator.
  RELEASE_REASON_PREEMPTED = 6;
}

// DropReason classifies why a node was dropped. Free text accompanies it on
// the event.
enum DropReason {
  // DROP_REASON_UNSPECIFIED is the zero value and carries no meaning.
  DROP_REASON_UNSPECIFIED = 0;
  // DROP_REASON_SUPERSEDED means other work replaced this node.
  DROP_REASON_SUPERSEDED = 1;
  // DROP_REASON_NOT_VIABLE means the work cannot be done as specified.
  DROP_REASON_NOT_VIABLE = 2;
  // DROP_REASON_NO_LONGER_RELEVANT means the need for the work went away.
  DROP_REASON_NO_LONGER_RELEVANT = 3;
  // DROP_REASON_OTHER means the free-text reason on the event is the whole
  // explanation.
  DROP_REASON_OTHER = 4;
}

// UsageKind distinguishes a measured cost from a predicted one.
enum UsageKind {
  // USAGE_KIND_UNSPECIFIED is the zero value and carries no meaning.
  USAGE_KIND_UNSPECIFIED = 0;
  // USAGE_KIND_ACTUAL is a cost reported after the fact.
  USAGE_KIND_ACTUAL = 1;
  // USAGE_KIND_ESTIMATE is a cost predicted before the work, with a basis.
  USAGE_KIND_ESTIMATE = 2;
}

// Project is an authorization scope, a namespace for node numbers, a rollup
// unit for cost, and a lifecycle unit. It is not a node.
message Project {
  // Output only. ULID assigned by the server. Immutable; the slug is only an
  // alias for it.
  string id = 1;
  // Output only. The organization the project belongs to, taken from the
  // caller's principal.
  string org_id = 2;
  // Lowercase alias derived from the title and disambiguated on collision,
  // at most 100 characters. Mutable; retired slugs keep resolving.
  string slug = 3;
  // Human-readable name.
  string title = 4;
  // Advisory priority of the project as a whole. Dagger never sorts by it.
  Priority priority = 5;
  // Output only. The next node number to allocate. A column on the project,
  // not a database sequence.
  int64 node_counter = 6;
  // Output only. When the project was archived, making it read-only. Unset
  // while active.
  google.protobuf.Timestamp archived_at = 7;
  // Output only. When the project was created.
  google.protobuf.Timestamp created_at = 8;
}

// Node is a unit of work: the one entity a human or agent thinks about
// directly.
message Node {
  // Output only. ULID assigned by the server. Internal; prose refers to a
  // node by project slug and number.
  string id = 1;
  // Output only. Sequential within the project, starting at 1. Displayed as
  // #7, or slug#7 across projects.
  int64 number = 2;
  // Output only. The organization the node belongs to.
  string org_id = 3;
  // Output only. The project the node belongs to. Nodes never move between
  // projects.
  string project_id = 4;
  // Id of the single parent node, answering "what is this part of". Empty
  // for a root node. Containment, not dependency.
  string parent_id = 5;
  // Single-valued label such as task, bug, spike, or chore. Dagger never
  // interprets it.
  string kind = 6;
  // Short human-readable summary.
  string title = 7;
  // Markdown. The prompt an agent receives.
  string body = 8;
  // Output only. Stored lifecycle state. Changed only through the
  // complete, drop, and reopen operations.
  Status status = 9;
  // Advisory priority, comparable only within the project. Defaults to P2.
  Priority priority = 10;
  // Which kind of principal may complete the node. Unset means
  // agent-eligible; USER makes the node a gate.
  AssigneeKind assignee_kind = 11;
  // Id of a specific principal the node is assigned to, if any.
  string assignee = 12;
  // Free strings for projection and filtering.
  repeated string labels = 13;
  // Output only. Opaque UUID minted at creation and shared by every attempt
  // on the node. Travels unchanged to the agent as the A2A context id or
  // harness session id.
  string context_id = 14;
  // Output only. When the node was created.
  google.protobuf.Timestamp created_at = 15;
  // Output only. Derived: an open node blocks this one through a BLOCKS
  // edge, or a gate blocking it has not been completed.
  bool blocked = 16;
  // Output only. Derived: open, not blocked, no live lease, and no open
  // children.
  bool ready = 17;
  // Output only. Derived: a live lease exists on the node.
  bool claimed = 18;
  // Output only. Derived from the event log: a user principal has written
  // to this node at least once.
  bool human_touched = 19;
  // Output only. The node's reference as a request names it: slug#7, the
  // project's current slug and the node's number.
  string reference = 20;
}

// Edge is a directed relation between two nodes in the same organization.
message Edge {
  // Id of the source node. For BLOCKS, the node that must finish first.
  string from = 1;
  // Id of the target node. For BLOCKS, the node that waits.
  string to = 2;
  // The relation expressed. Only BLOCKS affects readiness.
  EdgeKind kind = 3;
}

// Lease is the contract between dagger and whatever executes work: one
// attempt on one node, bounded by a TTL and fenced by its id.
message Lease {
  // Output only. ULID assigned by the server. The fencing token: returned by
  // Claim and required on every later write to the node.
  string id = 1;
  // Output only. The node the lease is held on. One live lease per node.
  string node_id = 2;
  // Output only. Id of the principal that claimed the node, resolved from
  // the transport.
  string holder = 3;
  // Output only. Id of the principal the holder acts for under a
  // server-known delegation grant. Never honored from a request; defined so
  // the shape does not change when delegation arrives.
  string on_behalf_of = 4;
  // Free string naming the executing harness, such as claude-code or hive.
  string harness = 5;
  // Where this attempt ran: an A2A agent card URL, or whatever the harness
  // identifies itself as. Recorded for placement affinity, never for
  // routing.
  string agent_ref = 6;
  // Optional harness session identifier, for a session that works several
  // nodes.
  string session_ref = 7;
  // Output only. When the lease expires unless renewed. Set from the
  // requested TTL, bounded by the server.
  google.protobuf.Timestamp expires_at = 8;
  // Output only. Why the lease ended. Unset while the lease is live.
  ReleaseReason release_reason = 9;
}

// Principal is an actor: a person, an agent, or a service. Its identities
// (unix uid, tailscale node, OIDC subject, token) are kept separately and
// resolved by the transport.
message Principal {
  // Output only. ULID assigned by the server. Stable across transports and
  // what every event and lease refers to.
  string id = 1;
  // Output only. The organization the principal belongs to.
  string org_id = 2;
  // Output only. Whether the principal is a user, an agent, or a service.
  PrincipalKind kind = 3;
}

// Result is what completing a node produces. Results of all blocking
// predecessors are the inputs a downstream agent assembles context from.
message Result {
  // Markdown summary of the outcome, under the configured size cap.
  string body = 1;
  // Outputs beyond text: pull requests, bundles, blobs.
  repeated Artifact artifacts = 2;
}

// Artifact is a named output attached to a node, shaped after A2A so an
// agent's completion flows into dagger without translation.
message Artifact {
  // Short name of the artifact, unique within its node.
  string name = 1;
  // What the artifact is and how a consumer should use it.
  string description = 2;
  // The content, in order.
  repeated Part parts = 3;
  // Free-form key-value metadata, as in A2A.
  google.protobuf.Struct metadata = 4;
}

// Part is one piece of an artifact: inline text, a managed blob, or a
// reference to something that lives elsewhere.
message Part {
  // Exactly one form of content.
  oneof content {
    // Inline text under the configured size cap.
    TextPart text = 1;
    // A dagger-managed, immutable, content-addressed object.
    BlobPart blob = 2;
    // A URI to content stored elsewhere, recorded with its resolved digest.
    ReferencePart reference = 3;
  }
}

// TextPart is inline text stored with the node.
message TextPart {
  // The text itself, under the configured inline size cap.
  string text = 1;
  // Output only. SHA-256 of the text as stored, computed by the server.
  string digest = 2;
  // IANA media type of the text, such as text/markdown.
  string media_type = 3;
  // Output only. Size of the text in bytes, computed by the server.
  int64 size = 4;
}

// BlobPart is a managed blob. Blobs are immutable and addressed by their
// digest, which is also the handle used to fetch them.
message BlobPart {
  // SHA-256 of the blob's bytes. Identifies the blob in the managed store.
  string digest = 1;
  // IANA media type of the blob.
  string media_type = 2;
  // Size of the blob in bytes.
  int64 size = 3;
}

// ReferencePart points at content dagger does not store. The URI is
// agent-supplied and untrusted; whoever fetches it applies its own scheme
// and host restrictions.
message ReferencePart {
  // Where the content lives. First-class schemes are git and oci, with https
  // as a fallback. A reference to something mutable records the resolved
  // immutable identity, such as the commit a branch pointed at.
  string uri = 1;
  // SHA-256 of the referenced content, proving byte integrity and nothing
  // else.
  string digest = 2;
  // IANA media type of the referenced content.
  string media_type = 3;
  // Size of the referenced content in bytes.
  int64 size = 4;
}

// Comment is content attached to a node: edited, threaded, and resolved by
// people. It is its own entity, not a kind of event.
message Comment {
  // Output only. ULID assigned by the server.
  string id = 1;
  // Output only. The node the comment is attached to.
  string node_id = 2;
  // Output only. Id of the principal that wrote the comment, resolved from
  // the transport.
  string author = 3;
  // Markdown, under the configured size cap. The current revision.
  string body = 4;
  // Id of the comment this one replies to, for threading. Empty for a
  // top-level comment.
  string in_reply_to = 5;
  // Output only. When the comment was resolved. Unset while open.
  google.protobuf.Timestamp resolved_at = 6;
  // Output only. Id of the principal that resolved the comment, resolved
  // from the transport.
  string resolved_by = 7;
  // Output only. Prior bodies, oldest first. Retained because nothing is
  // deleted.
  repeated CommentRevision revisions = 8;
}

// CommentRevision is a superseded body of a comment.
message CommentRevision {
  // The body as it stood before the edit.
  string body = 1;
  // Output only. Id of the principal that wrote this revision.
  string author = 2;
  // Output only. When this revision was written.
  google.protobuf.Timestamp created_at = 3;
}

// Usage is an append-only record of what an attempt cost, or was expected
// to cost, in tokens. Currency is applied at query time.
message Usage {
  // Output only. The node the cost is attributed to.
  string node_id = 1;
  // Output only. The attempt the cost is attributed to, so a retry does not
  // collapse into the original.
  string lease_id = 2;
  // Output only. Id of the principal that reported the actual or made the
  // estimate, resolved from the transport.
  string principal = 3;
  // Free string naming the model.
  string model = 4;
  // Tokens sent to the model.
  int64 input_tokens = 5;
  // Tokens produced by the model.
  int64 output_tokens = 6;
  // Tokens served from the model's prompt cache.
  int64 cache_read_tokens = 7;
  // Tokens written to the model's prompt cache.
  int64 cache_write_tokens = 8;
  // Whether the record is a measured actual or an estimate.
  UsageKind kind = 9;
  // Estimates only. Free text: what the estimate was reasoned from.
  string basis = 10;
  // Output only. When the record was written.
  google.protobuf.Timestamp created_at = 11;
}

// Event is the immutable record of one mutation. Every write produces one;
// together they are the audit log and the change stream.
message Event {
  // Output only. ULID assigned by the server. Time-ordered.
  string id = 1;
  // Output only. The organization the change happened in.
  string org_id = 2;
  // Output only. The project the change happened in.
  string project_id = 3;
  // Output only. The node the change touched, when it touched one.
  string node_id = 4;
  // Output only. Id of the acting principal, resolved from the transport.
  string principal = 5;
  // Output only. Kind of the acting principal, resolved from the transport.
  PrincipalKind principal_kind = 6;
  // Output only. Id of the principal the actor acted for under a
  // server-known delegation grant. Never honored from a request; defined so
  // the shape does not change when delegation arrives.
  string on_behalf_of = 7;
  // Output only. Which transport identity the actor used: unix, tailscale,
  // oidc, or token. Answers "acted via which transport".
  string identity_scheme = 8;
  // Output only. The idempotency key of the patch that produced the event.
  string request_id = 9;
  // Output only. The operation applied, such as create_node or add_edge.
  string op = 10;
  // Output only. Why, for transitions that carry a reason.
  string reason = 11;
  // Output only. The affected entity before the change. Absent for
  // creations.
  google.protobuf.Struct before = 12;
  // Output only. The affected entity after the change. Absent for removals.
  google.protobuf.Struct after = 13;
  // Output only. When the change was committed.
  google.protobuf.Timestamp occurred_at = 14;
}
