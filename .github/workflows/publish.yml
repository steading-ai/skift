# Publishes the built skift as a container image on every push to main, so
# another repository's workflow can pull it with nothing but its own
# GITHUB_TOKEN. See docs/ci.md.
#
# This is a publish, not a check: it does not run on pull requests, and it
# runs nothing else.
name: publish

on:
  push:
    branches: [main]

permissions: {}

# One push of the image at a time: a newer run waits for the one in flight
# rather than cancelling it part way.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the image
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history: the Makefile's VERSION falls back to counting
          # commits and finding tags with git, both of which need it. A
          # shallow clone would stamp a version a local build wouldn't.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
          # What this job builds is published, so it restores no cache an
          # earlier run could have written.
          cache: false

      - name: Cross-compile skift
        run: |
          VERSION="$(make version)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          make dist/skift-linux-amd64 dist/skift-linux-arm64 VERSION="$VERSION"

      - uses: docker/setup-buildx-action@v3.12.0

      - uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: packaging/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/steading-ai/skift:${{ github.sha }}
            ghcr.io/steading-ai/skift:main
