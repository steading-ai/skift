version: "2"

run:
  timeout: 5m
  # The root specs run `make lint` in several copies of the tree at once.
  # Without this, golangci-lint takes a machine-wide lock and the second
  # instance fails rather than waits.
  allow-parallel-runners: true

linters:
  default: standard
  enable:
    - depguard
    - forbidigo
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    # Handlers reach the database through the domain layer, never around it.
    # See docs/adrs/007-core-tech-stack.md.
    depguard:
      rules:
        store-only-from-domain:
          files:
            - "!**/internal/domain/**"
            - "!**/internal/store/**"
          deny:
            - pkg: github.com/steading-ai/skift/internal/store
              desc: only the domain layer may import the store
        # Interceptors authenticate and check methods. Resource-level
        # authorization needs the resolved write set, which exists only
        # inside the domain's transaction. See the Authorization section of
        # docs/architecture.md.
        no-policy-in-interceptors:
          files:
            - "**/internal/server/interceptor/**"
          deny:
            - pkg: github.com/steading-ai/skift/internal/policy
              desc: interceptors authenticate and check methods; resource authorization is the domain's, inside the transaction
    # Specs are Ginkgo. The testing package appears only in the suite
    # bootstrap file that hands control to Ginkgo, and in fuzz targets,
    # which go test drives directly and Ginkgo cannot host.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^testing\.
          msg: use Ginkgo and Gomega; testing belongs only in *_suite_test.go and *_fuzz_test.go
    # Ginkgo and Gomega are written with dot imports by design.
    revive:
      rules:
        - name: dot-imports
          arguments:
            - allowedPackages:
                - github.com/onsi/ginkgo/v2
                - github.com/onsi/gomega
  exclusions:
    rules:
      - path: (_suite|_fuzz)_test\.go$
        linters:
          - forbidigo

issues:
  # Report every rule that fires on a line. Hiding one violation behind
  # another on the same line costs an extra lint cycle to find it.
  uniq-by-line: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/steading-ai/skift
