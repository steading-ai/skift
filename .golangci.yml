version: "2"

run:
  timeout: 5m
  # The root specs run `make lint` in several copies of the tree at once.
  # Without this, golangci-lint takes a machine-wide lock and the second
  # instance fails rather than waits.
  allow-parallel-runners: true

linters:
  default: standard
  enable:
    - depguard
    - forbidigo
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    # Handlers reach the database through the domain layer, never around it.
    # The admin package operates the deployment (migrations, bootstrap,
    # opening the database, background jobs) and reaches the store directly;
    # it is not a handler. The spec harness hands specs a store over their
    # pool. See docs/adrs/007-core-tech-stack.md and
    # docs/adrs/016-background-jobs-and-admin.md.
    depguard:
      rules:
        store-only-from-domain-and-admin:
          files:
            - "!**/internal/domain/**"
            - "!**/internal/admin/**"
            - "!**/internal/store/**"
            - "!**/internal/testsupport/**"
          deny:
            - pkg: github.com/steading-ai/skift/internal/store
              desc: only the domain and admin packages may import the store (docs/adrs/016-background-jobs-and-admin.md)
        # Only the store reaches PostgreSQL: every statement, connection and
        # LISTEN lives there, so no other package can send SQL of its own.
        # Specs and the spec harness lay fixtures with pgx directly. See
        # docs/adrs/013-postgresql-only-through-the-store.md.
        pgx-only-in-store:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/store/**"
            - "!**/internal/testsupport/**"
          deny:
            - pkg: github.com/jackc/pgx/v5
              desc: only the store reaches PostgreSQL (docs/adrs/013-postgresql-only-through-the-store.md)
        # River runs skift's own background jobs. Its PostgreSQL driver
        # belongs with the pool it runs on, in the store; its core package,
        # whose workers and schedules carry no pgx types, also belongs in
        # admin, which owns the schedule. See
        # docs/adrs/016-background-jobs-and-admin.md.
        river-drivers-only-in-store:
          files:
            - "$all"
            - "!**/internal/store/**"
          deny:
            - pkg: github.com/riverqueue/river/riverdriver
              desc: River's PostgreSQL driver runs on the store's pool, so only the store builds it (docs/adrs/016-background-jobs-and-admin.md)
        river-only-in-store-and-admin:
          files:
            - "$all"
            - "!**/internal/store/**"
            - "!**/internal/admin/**"
          deny:
            - pkg: github.com/riverqueue/river
              desc: background jobs are admin's, run on the store (docs/adrs/016-background-jobs-and-admin.md)
        # Interceptors authenticate and check methods. Resource-level
        # authorization needs the resolved write set, which exists only
        # inside the domain's transaction. See the Authorization section of
        # docs/architecture.md.
        no-policy-in-interceptors:
          files:
            - "**/internal/server/interceptor/**"
          deny:
            - pkg: github.com/steading-ai/skift/internal/policy
              desc: interceptors authenticate and check methods; resource authorization is the domain's, inside the transaction
    # Specs are Ginkgo. The testing package appears only in the suite
    # bootstrap file that hands control to Ginkgo, and in fuzz targets,
    # which go test drives directly and Ginkgo cannot host.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^testing\.
          msg: use Ginkgo and Gomega; testing belongs only in *_suite_test.go and *_fuzz_test.go
        # The raw transaction and the pool are how specs lay fixtures. In
        # code that ships they would be a way around the store. See
        # docs/adrs/013-postgresql-only-through-the-store.md.
        - pattern: ^store\.(Raw|Store\.Pool)$
          pkg: ^github\.com/steading-ai/skift/internal/store$
          msg: for spec fixtures only; SQL that ships lives in the store (docs/adrs/013-postgresql-only-through-the-store.md)
    # Ginkgo and Gomega are written with dot imports by design.
    revive:
      rules:
        - name: dot-imports
          arguments:
            - allowedPackages:
                - github.com/onsi/ginkgo/v2
                - github.com/onsi/gomega
  exclusions:
    rules:
      - path: (_suite|_fuzz)_test\.go$
        linters:
          - forbidigo
      - path: _test\.go$
        linters:
          - forbidigo
        text: for spec fixtures only

issues:
  # Report every rule that fires on a line. Hiding one violation behind
  # another on the same line costs an extra lint cycle to find it.
  uniq-by-line: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/steading-ai/skift
